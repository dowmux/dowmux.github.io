<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaotic Video Player — No Black Frames</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #140033; /* не чёрный — на случай мгновенной загрузки */
    font-family: system-ui, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed; inset: 0;
    overflow: hidden;
    background: transparent;
    cursor: pointer;
    will-change: transform, filter;
    transform-origin: center center;
  }

  /* Постоянная яркая подложка — гарантирует отсутствие чёрного */
  #brightBase {
    position: fixed; inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 20% 30%, #ff2d95 0%, transparent 55%),
      radial-gradient(ellipse at 80% 20%, #00e5ff 0%, transparent 55%),
      radial-gradient(ellipse at 50% 85%, #b400ff 0%, transparent 60%),
      linear-gradient(135deg, #140033 0%, #001a33 50%, #33001a 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%, 100% 100%;
    animation: brightShift 18s ease-in-out infinite;
    filter: saturate(1.4) brightness(1.15);
  }
  @keyframes brightShift {
    0%, 100% { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
    33%      { background-position: 100% 50%, 0% 50%, 50% 0%, 0 0; }
    66%      { background-position: 50% 100%, 50% 100%, 0% 50%, 0 0; }
  }

  /* Слои картинок — плавное перетекание opacity, никаких резких обнулений */
  .img-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity, filter;
    z-index: 1;
    display: block;
    transition: opacity 0.25s ease;
  }

  /* Видео-слои — то же плавное перетекание */
  .video-file-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity, filter;
    z-index: 1;
    background: transparent;
    transition: opacity 0.25s ease;
  }

  #bassShockwave {
    position: fixed;
    top: 50%; left: 50%;
    width: 100vmax; height: 100vmax;
    transform: translate(-50%, -50%) scale(0);
    border-radius: 50%;
    pointer-events: none;
    z-index: 780;
    opacity: 0;
    background: radial-gradient(circle,
      rgba(255,255,255,0) 30%,
      rgba(0,255,255,0.35) 55%,
      rgba(255,0,200,0.25) 70%,
      transparent 85%);
    mix-blend-mode: screen;
    will-change: transform, opacity;
  }

  #bassVignette {
    position: fixed; inset: 0;
    z-index: 775;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at center,
      transparent 40%,
      rgba(255,0,150,0.25) 70%,
      rgba(0,0,0,0.6) 100%);
    mix-blend-mode: multiply;
    will-change: opacity;
    transition: opacity 0.1s ease-out;
  }

  #spectrumWrap {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    width: 100vw;
    height: 180px;
    z-index: 800;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
    mix-blend-mode: screen;
  }
  #spectrumWrap.visible { opacity: 1; }
  #spectrumCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  #titleOverlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1400;
    pointer-events: none;
    text-align: center;
    opacity: 0;
    max-width: 90vw;
    padding: 24px 40px;
    will-change: transform, opacity;
    transition: opacity 0.15s ease;
  }
  #titleOverlay.visible { opacity: 1; }

  #titleText {
    font-family: 'Arial Black', 'Impact', system-ui, sans-serif;
    font-size: clamp(32px, 6vw, 96px);
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1.05;
    color: #fff;
    text-shadow:
      0 0 10px rgba(255,255,255,0.6),
      0 0 30px rgba(0,255,255,0.7),
      0 0 60px rgba(255,0,200,0.5),
      2px 2px 0 #000, -2px -2px 0 #000,
      2px -2px 0 #000, -2px 2px 0 #000;
    position: relative;
    will-change: transform, text-shadow;
    transition: transform 0.1s ease;
  }
  #titleText::before,
  #titleText::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0;
    text-shadow: none;
  }
  #titleText::before { color: #0ff; transform: translate(-2px, -2px); }
  #titleText::after  { color: #f0f; transform: translate(2px, 2px); }

  #titleOverlay.glitch #titleText::before {
    opacity: 0.85;
    animation: glitchShiftA 0.12s steps(2) infinite;
  }
  #titleOverlay.glitch #titleText::after {
    opacity: 0.85;
    animation: glitchShiftB 0.12s steps(2) infinite;
  }
  @keyframes glitchShiftA {
    0%   { transform: translate(-3px, 1px); }
    50%  { transform: translate(2px, -2px); }
    100% { transform: translate(-1px, 2px); }
  }
  @keyframes glitchShiftB {
    0%   { transform: translate(3px, -1px); }
    50%  { transform: translate(-2px, 2px); }
    100% { transform: translate(1px, -2px); }
  }

  #titleOverlay.beat #titleText {
    transform: scale(1.06);
    text-shadow:
      0 0 20px rgba(255,255,255,0.9),
      0 0 50px rgba(0,255,255,1),
      0 0 90px rgba(255,0,200,0.8),
      2px 2px 0 #000, -2px -2px 0 #000,
      2px -2px 0 #000, -2px 2px 0 #000;
  }

  #titleLine {
    margin: 12px auto 0;
    width: 60%;
    max-width: 400px;
    height: 2px;
    background: linear-gradient(90deg,
      transparent,
      rgba(0,255,255,0.8),
      rgba(255,0,200,0.8),
      transparent);
    box-shadow: 0 0 15px rgba(0,255,255,0.6);
  }

  #titleSub {
    margin-top: 16px;
    font-family: system-ui, sans-serif;
    font-size: clamp(10px, 1.4vw, 14px);
    letter-spacing: 0.6em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,255,255,0.4);
    opacity: 0.85;
  }

  #titleOverlay.intro { animation: titleIntro 2.5s ease-out; }
  @keyframes titleIntro {
    0%   { transform: translate(-50%, -50%) scale(0.7); filter: blur(8px); opacity: 0; }
    15%  { transform: translate(-50%, -50%) scale(1.02); filter: blur(0); opacity: 1; }
    80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); }
  }

  #playBtn {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.8);
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    cursor: pointer;
    z-index: 2000;
    transition: all 0.4s ease;
    display: flex; align-items: center; justify-content: center;
    animation: pulse 2s infinite;
  }
  #playBtn:hover {
    transform: translate(-50%, -50%) scale(1.1);
    background: rgba(255,255,255,0.2);
    border-color: #fff;
  }
  #playBtn svg {
    width: 45px; height: 45px;
    fill: #fff; margin-left: 8px;
    transition: transform 0.3s ease;
  }
  #playBtn.hidden {
    opacity: 0; pointer-events: none;
    transform: translate(-50%, -50%) scale(0.5);
    animation: none;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
    50%      { box-shadow: 0 0 0 30px rgba(255,255,255,0); }
  }

  #status {
    position: fixed;
    bottom: 200px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-size: 22px;
    letter-spacing: 4px;
    z-index: 1500;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 0 20px rgba(0,0,0,0.9), 0 0 30px rgba(0,255,255,0.5);
  }
  #status.visible { opacity: 1; }

  #hint {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    letter-spacing: 1.5px;
    z-index: 1500;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
    text-align: center;
    padding: 8px 16px;
    background: rgba(0,0,0,0.4);
    border-radius: 20px;
    backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  #hint.visible { opacity: 1; }

  #audioWarn {
    position: fixed;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,200,80,0.85);
    font-size: 10px;
    letter-spacing: 1px;
    z-index: 1500;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
    padding: 6px 12px;
    background: rgba(0,0,0,0.55);
    border-radius: 12px;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }
  #audioWarn.visible { opacity: 1; }

  #progressWrap {
    position: fixed;
    bottom: 180px; left: 0;
    width: 100%;
    height: 44px;
    z-index: 1600;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  #progressWrap.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  #progressBar {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  #progressFill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0ff, #f0f, #ff0);
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  #timeLabel {
    color: rgba(255,255,255,0.75);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    min-width: 90px;
    text-shadow: 0 0 6px rgba(0,0,0,0.9);
  }

  #nextBtn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.4);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  #nextBtn:hover {
    background: rgba(255,255,255,0.25);
    border-color: #fff;
    transform: scale(1.1);
  }
  #nextBtn svg { width: 14px; height: 14px; fill: #fff; }

  #pauseOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(4px);
    z-index: 1800;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #pauseOverlay.visible { display: flex; opacity: 1; }
  #pauseOverlay svg {
    width: 80px; height: 80px;
    fill: rgba(255,255,255,0.9);
    margin-left: 8px;
  }

  #beatFlash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0;
    z-index: 750;
    pointer-events: none;
    mix-blend-mode: overlay;
    transition: opacity 0.06s ease-out;
  }

  #chaosFlash {
    position: fixed; inset: 0;
    opacity: 0;
    z-index: 760;
    pointer-events: none;
    mix-blend-mode: color-dodge;
    transition: opacity 0.1s ease-out;
  }

  #glowVeil {
    position: fixed; inset: 0;
    z-index: 770;
    pointer-events: none;
    mix-blend-mode: screen;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.08), transparent 70%);
  }

  #bassChroma {
    position: fixed; inset: 0;
    z-index: 785;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
    background:
      linear-gradient(90deg, rgba(255,0,0,0.15), transparent 30%, transparent 70%, rgba(0,255,255,0.15));
    will-change: opacity;
    transition: opacity 0.08s ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    #playBtn { animation: none; }
    #brightBase { animation: none; }
    .img-layer, .video-file-layer { transition: none !important; }
    #beatFlash, #chaosFlash, #bassShockwave, #bassVignette, #bassChroma { display: none; }
    #titleOverlay.glitch #titleText::before,
    #titleOverlay.glitch #titleText::after { animation: none; }
  }
</style>
</head>
<body>

<div id="brightBase"></div>
<div id="stage"></div>

<div id="bassVignette"></div>
<div id="bassShockwave"></div>
<div id="bassChroma"></div>

<div id="beatFlash"></div>
<div id="chaosFlash"></div>
<div id="glowVeil"></div>

<div id="titleOverlay">
  <div id="titleText" data-text="">&nbsp;</div>
  <div id="titleLine"></div>
  <div id="titleSub">now playing</div>
</div>

<div id="spectrumWrap">
  <canvas id="spectrumCanvas"></canvas>
</div>

<button id="playBtn" aria-label="Play">
  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</button>

<div id="status">▶</div>
<div id="hint">тап — новый кадр · свайп — фильтр · двойной тап — пауза</div>
<div id="audioWarn"></div>

<div id="progressWrap">
  <span id="timeLabel">0:00 / 0:00</span>
  <div id="progressBar">
    <div id="progressFill"></div>
  </div>
  <button id="nextBtn" aria-label="Next track" title="Следующий трек">
    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
  </button>
</div>

<div id="pauseOverlay">
  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</div>

<audio id="audio" preload="auto" crossorigin="anonymous"></audio>

<script>

   КОНФИГУРАЦИЯ
   ============================================================ */
const CONFIG = {

  SPECTRUM_BARS: 128,
  SPECTRUM_HEIGHT_PX: 180,

  TREBLE_BOOST_DB: 12,
  TREBLE_FREQ_HZ: 3000,

  BASS_IMPACT_THRESHOLD: 0.42,
  BASS_IMPACT_MIN_INTERVAL: 140,
  BASS_SHAKE_PX: 18,
  BASS_ZOOM_AMOUNT: 0.035,
  BASS_CHROMA_PX: 14,
  BASS_VIGNETTE_STRENGTH: 0.5,
  BASS_SHOCKWAVE_DURATION: 480,

  BPM_MIN: 60,
  BPM_MAX: 160,
  FLICKER_SLOW: [400, 900],
  FLICKER_FAST: [40, 100],

  STATUS_HIDE_DELAY: 2500,

  TITLE_FLASH_ON_SWITCH: 0.35,
  TITLE_FLASH_DURATION: [80, 260],
  TITLE_GLITCH_ON_FLASH: 0.6,
  TITLE_GLITCH_DURATION: [60, 160],
  TITLE_DOUBLE_FLASH_CHANCE: 0.25,

  TITLE_GLITCH_ON_BEAT: true,
  TITLE_GLITCH_MIN_INTERVAL: 280,

  DOUBLE_SWITCH_CHANCE: 0.35,

  // === Ключевое: КРОСС-ФЕЙД ===
  // Сколько слоёв держим одновременно для плавного перехода (без чёрного)
  IMG_LAYERS_COUNT: 4,
  // Длительность кросс-фейда между слоями (мс)
  CROSSFADE_MS: 250,

  // Длительность одного видео-фрагмента
  VIDEO_CLIP_DURATION: [4000, 12000],

  MIN_SCALE: 1.0,
  MAX_SCALE: 1.5,

  VIDEO_PICK_CHANCE: 0.5,

  // Минимальное «время жизни» слоя перед повторным использованием

  FILTERS: [
    { name: 'natural',    hue: [0, 0],        sat: [1.0, 1.2],  con: [1.0, 1.15], bri: [1.0, 1.1] },

    { name: 'blood',      hue: [330, 380],    sat: [1.8, 2.4],  con: [1.4, 1.8],  bri: [0.9, 1.05] },
    { name: 'ice',        hue: [160, 220],    sat: [1.5, 2.2],  con: [1.1, 1.4],  bri: [1.0, 1.15] },
    { name: 'sepia',      hue: [20, 50],      sat: [0.8, 1.2],  con: [1.1, 1.3],  bri: [0.95, 1.1], sepia: [0.4, 0.8] },
    { name: 'mono',       hue: [0, 0],        sat: [0, 0.3],    con: [1.3, 1.8],  bri: [1.0, 1.2],  grayscale: [0.8, 1.0] },
    { name: 'inverted',   hue: [0, 360],      sat: [1.2, 2.0],  con: [1.0, 1.4],  bri: [0.9, 1.1],  invert: [0.85, 1.0] },
    { name: 'dream',      hue: [180, 300],    sat: [1.3, 2.0],  con: [0.9, 1.1],  bri: [1.1, 1.3] },
    { name: 'sunset',     hue: [0, 40],       sat: [1.6, 2.2],  con: [1.1, 1.4],  bri: [1.0, 1.15] },
    { name: 'toxic',      hue: [80, 160],     sat: [2.0, 3.0],  con: [1.3, 1.7],  bri: [0.95, 1.1] },
    { name: 'ghost',      hue: [200, 260],    sat: [0.5, 1.0],  con: [1.2, 1.5],  bri: [1.1, 1.3] },
    { name: 'blurred',    hue: [0, 360],      sat: [1.2, 1.8],  con: [1.0, 1.3],  bri: [1.0, 1.1],  blur: [1, 3] },
  ],

   PLAYLIST: [
    {
      src: 'https://cs9-10v4.vkuseraudio.net/s/v1/acmp/4z_2ioIaRiLEVDbO6VLZiKq7GT__PN55kXevA1klh9atvVLrcLTgaLr1xS5aFd7oPQkgkQb6Z2t-W4_HhCynCTBxy5rCDdgHL9sPD4RnTRL8hsTw-W3e_TUajzckg-UnBI8iNk_AKMfQ2hp3QKF3cuDDZKGyn6062M0-fhMnNk948qWWjLZK.mp3?siren=1',
      title: 'Group Therapy',
      shortTitle: 'Above and Beyond',
    },
    {
      src: 'HeldeepRadio.aac',
      title: 'Oliver Heldens',
      shortTitle: 'Heldeep Radio',
    },
  ],

  // === ВИДЕО-ПЛЕЙЛИСТ ===
  // Можно задать вручную или добавить через панель настроек
  VIDEOS: [
    // Примеры (замени на свои):
    'https://upload.wikimedia.org/wikipedia/commons/8/81/Surfing-1012628%2C_Dingle_Peninsula%2C_Co._Kerry%2C_Ireland.webm?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original',
    'https://upload.wikimedia.org/wikipedia/commons/0/09/Surfing-1012624%2C_Dingle_Peninsula%2C_Co._Kerry%2C_Ireland.webm?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original',
  ],
    
  // Стандартные картинки (Picsum — CORS-friendly, всегда доступны)
  IMAGE_URLS: [
    'https://videocdn.cdnpk.net/videos/cd4971c7-9a32-591b-93bd-27bc1fe92bf5/horizontal/thumbnails/large.jpg?semt=ais_hybrid&item_id=7230597&w=740&q=80',
    'https://art-apple.ru/albums/userpics/10001/girl-surfing-waves.jpg',
    'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnncYNoo_yZ26X6WE7-s0T5IODT9awNpVod2Eax4kmwzrSUmvjJjYDe_s&s=10',
    'https://img.magnific.com/free-photo/vertical-shot-surfers-doing-tricks-ocean-taking-waves_181624-11019.jpg?semt=ais_hybrid&w=740&q=80',

/* ============================================================
   WEBAUDIO ANALYSER
   ============================================================ */
function initAnalyser() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    highShelf = audioCtx.createBiquadFilter();
    highShelf.type = 'highshelf';
    highShelf.frequency.value = CONFIG.TREBLE_FREQ_HZ;
    highShelf.gain.value = CONFIG.TREBLE_BOOST_DB;

    const airFilter = audioCtx.createBiquadFilter();
    airFilter.type = 'peaking';
    airFilter.frequency.value = 10000;
    airFilter.Q.value = 1;
    airFilter.gain.value = 6;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.7;
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;
    freqData = new Uint8Array(analyser.frequencyBinCount);

    audioSource = audioCtx.createMediaElementSource(audio);

    audioSource.connect(highShelf);
    highShelf.connect(airFilter);
    airFilter.connect(analyser);
    analyser.connect(audioCtx.destination);

    analyserAvailable = true;
    console.log(`✅ Analyser готов. Treble +${CONFIG.TREBLE_BOOST_DB}dB`);
  } catch (e) {
    console.warn('⚠ Analyser недоступен (CORS/Referer):', e);
    analyserAvailable = false;
    audioCtx = null;
    analyser = null;
    freqData = null;
    audioSource = null;
    highShelf = null;
    audioWarnEl.textContent = '⚠ аудио-анализ недоступен (CORS) — визуал в авто-режиме';
    audioWarnEl.classList.add('visible');
    setTimeout(() => audioWarnEl.classList.remove('visible'), 6000);
    tempoLocked = true;
  }
}

/* ============================================================
   БАС-УДАР
   ============================================================ */
function triggerBassImpact(intensity) {
  if (CONFIG.REDUCED_MOTION) return;
  const now = performance.now();
  if (now - lastBassImpactTime < CONFIG.BASS_IMPACT_MIN_INTERVAL) return;
  lastBassImpactTime = now;

  const I = Math.max(0.2, Math.min(1, intensity));

  if (!bassShakeActive) bassShakeActive = true;
  const shakeAmt = CONFIG.BASS_SHAKE_PX * I;
  const sx = (Math.random() - 0.5) * 2 * shakeAmt;
  const sy = (Math.random() - 0.5) * 2 * shakeAmt;
  const zoom = 1 + CONFIG.BASS_ZOOM_AMOUNT * I;
  stage.style.transform = `translate(${sx}px, ${sy}px) scale(${zoom})`;

  if (bassShakeTimeout) clearTimeout(bassShakeTimeout);
  bassShakeTimeout = setTimeout(() => {
    stage.style.transition = 'transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1)';
    stage.style.transform = 'translate(0, 0) scale(1)';
    setTimeout(() => {
      stage.style.transition = '';
      bassShakeActive = false;
    }, 180);
  }, 40);

  if (!shockwaveActive) {
    shockwaveActive = true;
    bassShockwave.style.transition = 'none';
    bassShockwave.style.transform = 'translate(-50%, -50%) scale(0)';
    bassShockwave.style.opacity = '0.9';
    void bassShockwave.offsetWidth;
    bassShockwave.style.transition =
      `transform ${CONFIG.BASS_SHOCKWAVE_DURATION}ms cubic-bezier(0.15, 0.7, 0.3, 1),
       opacity ${CONFIG.BASS_SHOCKWAVE_DURATION}ms ease-out`;
    bassShockwave.style.transform = `translate(-50%, -50%) scale(${1.5 + I * 1.2})`;
    bassShockwave.style.opacity = '0';
    setTimeout(() => { shockwaveActive = false; }, CONFIG.BASS_SHOCKWAVE_DURATION);
  }

  bassChroma.style.opacity = String(0.4 + I * 0.5);
  bassChroma.style.background =
    `linear-gradient(90deg,
      rgba(255,0,60,${0.35 * I}) 0%,
      transparent 25%,
      transparent 75%,
      rgba(0,220,255,${0.35 * I}) 100%)`;
  setTimeout(() => { bassChroma.style.opacity = '0'; }, 100 + I * 100);

  bassVignette.style.opacity = String(CONFIG.BASS_VIGNETTE_STRENGTH * I);
  setTimeout(() => { bassVignette.style.opacity = '0'; }, 200 + I * 200);
}

/* ============================================================
   ОБНОВЛЕНИЕ ЭНЕРГИЙ + ТЕМП
   ============================================================ */
function updateAudioEnergy(now) {
  if (analyserAvailable && analyser && freqData) {
    analyser.getByteFrequencyData(freqData);

    const binCount = freqData.length;
    const nyquist = audioCtx.sampleRate / 2;
    const binHz = nyquist / binCount;

    const bassEnd = Math.min(binCount - 1, Math.floor(250 / binHz));
    const midEnd  = Math.min(binCount - 1, Math.floor(4000 / binHz));
    const highEnd = Math.min(binCount - 1, Math.floor(16000 / binHz));

    let b = 0, m = 0, h = 0;
    for (let i = 1; i < bassEnd; i++) b += freqData[i];
    for (let i = bassEnd; i < midEnd; i++) m += freqData[i];
    for (let i = midEnd; i < highEnd; i++) h += freqData[i];

    bassEnergy = b / Math.max(1, bassEnd - 1) / 255;
    midEnergy  = m / Math.max(1, midEnd - bassEnd) / 255;
    highEnergy = h / Math.max(1, highEnd - midEnd) / 255;

    const bassDelta = bassEnergy - prevBassEnergy;
    const timeSinceLastBeat = now - lastBeatTime;

    if (bassDelta > 0.1 && bassEnergy > CONFIG.BASS_IMPACT_THRESHOLD) {
      const intensity = Math.min(1, bassEnergy * 1.4 + bassDelta * 3);
      triggerBassImpact(intensity);
    }

    if (bassDelta > 0.08 && bassEnergy > 0.32 && timeSinceLastBeat > 180) {
      lastBeatTime = now;
      beatPulse = 1.0;
      eventTimes.push(now);

      if (beatIntervals.length > 0) {
        const interval = now - beatIntervals[beatIntervals.length - 1];
        if (interval > 200 && interval < 1500) {
          beatIntervals.push(now);
          if (beatIntervals.length > 10) beatIntervals.shift();
          const instantBpm = 60000 / interval;
          if (bpmSmooth === 0) bpmSmooth = instantBpm;
          else {
            const alpha = tempoLocked ? 0.15 : 0.4;
            bpmSmooth = bpmSmooth * (1 - alpha) + instantBpm * alpha;
          }
          if (beatIntervals.length >= 4) tempoLocked = true;
        }
      } else {
        beatIntervals.push(now);
      }

      if (!CONFIG.REDUCED_MOTION) {
        beatFlash.style.opacity = Math.min(0.35, bassDelta * 2.5);
        setTimeout(() => { beatFlash.style.opacity = '0'; }, 80);
      }

      if (CONFIG.TITLE_GLITCH_ON_BEAT && titleOverlay.classList.contains('visible')) {
        const timeSinceGlitch = now - lastTitleGlitchTime;
        if (timeSinceGlitch > CONFIG.TITLE_GLITCH_MIN_INTERVAL) {
          lastTitleGlitchTime = now;
          triggerTitleGlitch(80 + Math.random() * 100);
        }
      }
      if (titleOverlay.classList.contains('visible')) {
        titleOverlay.classList.add('beat');
        clearTimeout(titleBeatTimeout);
        titleBeatTimeout = setTimeout(() => {
          titleOverlay.classList.remove('beat');
        }, 120);
      }
    }

    const highDelta = highEnergy - prevHighEnergy;
    const timeSinceHighBeat = now - lastHighBeatTime;
    if (highDelta > 0.06 && highEnergy > 0.25 && timeSinceHighBeat > 120) {
      lastHighBeatTime = now;
      highPulse = 1.0;
      eventTimes.push(now);
    }

    prevBassEnergy = bassEnergy;
    prevHighEnergy = highEnergy;

    beatPulse *= 0.88;
    highPulse *= 0.82;

    const bars = CONFIG.SPECTRUM_BARS;
    const minFreq = 30, maxFreq = 18000;
    const logMin = Math.log10(minFreq);
    const logMax = Math.log10(maxFreq);

    for (let i = 0; i < bars; i++) {
      const t0 = i / bars;
      const t1 = (i + 1) / bars;
      const f0 = Math.pow(10, logMin + (logMax - logMin) * t0);
      const f1 = Math.pow(10, logMin + (logMax - logMin) * t1);
      const bin0 = Math.max(1, Math.floor(f0 / binHz));
      const bin1 = Math.min(binCount - 1, Math.ceil(f1 / binHz));
      let sum = 0, count = 0;
      for (let j = bin0; j <= bin1; j++) { sum += freqData[j]; count++; }
      let v = count > 0 ? sum / count / 255 : 0;
      if (i > bars * 0.6) v *= 1.6;
      else if (i > bars * 0.4) v *= 1.25;
      const prev = spectrumValues[i];
      spectrumValues[i] = v > prev
        ? prev + (v - prev) * 0.65
        : prev + (v - prev) * 0.15;
    }
  } else {
    fakeEnergyPhase += 0.016;
    const t = now * 0.001;
    bassEnergy = 0.35 + 0.3 * Math.sin(t * 1.5) * Math.sin(t * 0.7);
    midEnergy  = 0.4 + 0.3 * Math.sin(t * 2.1 + 1.3);
    highEnergy = 0.5 + 0.4 * Math.abs(Math.sin(t * 3.7 + 2.1));
    bassEnergy = Math.max(0.05, Math.min(0.95, bassEnergy));
    midEnergy  = Math.max(0.05, Math.min(0.95, midEnergy));
    highEnergy = Math.max(0.05, Math.min(0.95, highEnergy));

    if (bassEnergy > 0.6 && Math.sin(t * 2) > 0.95) triggerBassImpact(bassEnergy * 0.8);

    beatPulse *= 0.9;
    highPulse *= 0.85;

    bpmSmooth = 90 + 50 * Math.sin(t * 0.15);
    tempoLocked = true;

    const bars = CONFIG.SPECTRUM_BARS;
    for (let i = 0; i < bars; i++) {
      const t0 = i / bars;
      const v = 0.3 + 0.5 * Math.abs(Math.sin(t * 2 + t0 * 12))
              + 0.2 * Math.abs(Math.sin(t * 4 + t0 * 25));
      spectrumValues[i] = Math.min(1, v);
    }
  }

  const cutoff = now - 1000;
  while (eventTimes.length && eventTimes[0] < cutoff) eventTimes.shift();
  const instantDensity = eventTimes.length;
  eventDensity = eventDensity * 0.9 + instantDensity * 0.1;

  let bpmNorm = 0;
  if (bpmSmooth > 0) {
    bpmNorm = (bpmSmooth - CONFIG.BPM_MIN) / (CONFIG.BPM_MAX - CONFIG.BPM_MIN);
    bpmNorm = Math.max(0, Math.min(1, bpmNorm));
  }
  let densityNorm = Math.max(0, Math.min(1, eventDensity / 8));
  const rawTempo = tempoLocked
    ? (bpmNorm * 0.7 + densityNorm * 0.3)
    : densityNorm;

  tempoNorm = tempoNorm * 0.92 + rawTempo * 0.08;
  tempoNorm = Math.max(0, Math.min(1, tempoNorm));

  const slowAvg = (CONFIG.FLICKER_SLOW[0] + CONFIG.FLICKER_SLOW[1]) / 2;
  const fastAvg = (CONFIG.FLICKER_FAST[0] + CONFIG.FLICKER_FAST[1]) / 2;
  nextFlickerDelay = slowAvg + (fastAvg - slowAvg) * tempoNorm;
}

/* ============================================================
   ЦВЕТОВЫЕ ФИЛЬТРЫ
   ============================================================ */
function pickRandomFilter() {
  return CONFIG.FILTERS[Math.floor(Math.random() * CONFIG.FILTERS.length)];
}

function randomInRange(range) {
  if (!range) return null;
  return range[0] + Math.random() * (range[1] - range[0]);
}

function applyRandomFilter(el, filterOverride) {
  const f = filterOverride || pickRandomFilter();

  const hue = randomInRange(f.hue) || 0;
  const sat = randomInRange(f.sat) || 1;
  const con = randomInRange(f.con) || 1;
  const bri = randomInRange(f.bri) || 1;
  const sepia = f.sepia ? randomInRange(f.sepia) : 0;
  const grayscale = f.grayscale ? randomInRange(f.grayscale) : 0;
  const invert = f.invert ? randomInRange(f.invert) : 0;
  const blur = f.blur ? randomInRange(f.blur) : 0;

  let filter = `hue-rotate(${hue.toFixed(1)}deg) saturate(${sat.toFixed(2)}) contrast(${con.toFixed(2)}) brightness(${bri.toFixed(2)})`;
  if (sepia > 0) filter += ` sepia(${sepia.toFixed(2)})`;
  if (grayscale > 0) filter += ` grayscale(${grayscale.toFixed(2)})`;
  if (invert > 0) filter += ` invert(${invert.toFixed(2)})`;
  if (blur > 0) filter += ` blur(${blur.toFixed(1)}px)`;

  el.style.filter = filter;
  el.dataset.filterName = f.name;

  return f;
}

/* ============================================================
   ОЧЕРЕДЬ КАРТИНОК
   ============================================================ */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function refillImageQueue() {
  imageQueue = shuffleArray(CONFIG.IMAGE_URLS);
  if (imageQueue.length > 1 && imageQueue[0] === lastImageUrl) {
    [imageQueue[0], imageQueue[1]] = [imageQueue[1], imageQueue[0]];
  }
}

function getNextImageUrl() {
  if (!imageQueue.length) refillImageQueue();
  const url = imageQueue.shift();
  lastImageUrl = url;
  return url;
}

/* ============================================================
   CANVAS-СЛОИ
   ============================================================ */
function createImageLayer() {
  const canvas = document.createElement('canvas');
  canvas.className = 'img-layer';
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  const ctx = canvas.getContext('2d', { alpha: false });
  stage.appendChild(canvas);
  return {
    canvas,
    ctx,
    currentImgUrl: null,
    // Когда слой последний раз был активен (для cooldown)
    lastActive: 0,
    busy: false,
  };
}

function updateImageLayersResolution() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.floor(window.innerWidth * dpr);
  const h = Math.floor(window.innerHeight * dpr);
  imgLayers.forEach(l => {
    if (l.canvas.width !== w || l.canvas.height !== h) {
      l.canvas.width = w;
      l.canvas.height = h;
    }
  });
}

function drawImageToLayer(layer, img, transformOverride) {
  if (!img) return;
  const W = layer.canvas.width;
  const H = layer.canvas.height;
  const ctx = layer.ctx;

  ctx.save();
  // Заливаем цветом (не чёрным) — на случай, если картинка с прозрачностью
  ctx.fillStyle = '#1a0a2a';
  ctx.fillRect(0, 0, W, H);

  const imgW = img.width;
  const imgH = img.height;
  const scaleCover = Math.max(W / imgW, H / imgH) * 1.08; // запас больше — углы не пустеют
  const dw = imgW * scaleCover;
  const dh = imgH * scaleCover;

  const t = transformOverride || {};
  const tx = t.tx || 0;
  const ty = t.ty || 0;
  const rot = t.rot || 0;
  const zoom = t.zoom || 1;

  ctx.translate(W / 2 + tx, H / 2 + ty);
  ctx.rotate(rot);
  ctx.scale(zoom, zoom);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);

  ctx.restore();
}

/* ============================================================
   ВИДЕО-СЛОИ

function createVideoLayer(url, index) {
  const video = document.createElement('video');
  video.className = 'video-file-layer';
  video.src = url;
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  video.crossOrigin = 'anonymous';
  video.setAttribute('webkit-playsinline', '');
  video.setAttribute('playsinline', '');

  video.addEventListener('error', () => {
    console.warn('❌ Видео не загрузилось:', url, video.error?.code, video.error?.message);
  });
  video.addEventListener('loadeddata', () => {
    console.log('🎬 Видео готово:', url);
  });

  stage.appendChild(video);
  return { el: video, url, index, busy: false, lastActive: 0 };
}

function initVideoLayers() {
  videoLayers.forEach(v => v.el.remove());
  videoLayers = [];
  if (!CONFIG.VIDEOS.length) {
    console.log('ℹ️ Видео не задано — работают только картинки');
    return;
  }
  CONFIG.VIDEOS.forEach((url, i) => {
    videoLayers.push(createVideoLayer(url, i));
  });
  console.log(`🎬 Загружено ${videoLayers.length} видео`);
}

/* ============================================================
   ИНТЕРНЕТ-КАРТИНКИ
   ============================================================ */
function loadImage(url) {
  return new Promise((resolve) => {
    if (imageCache.has(url)) { resolve(imageCache.get(url)); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { imageCache.set(url, img); resolve(img); };
    img.onerror = () => { console.warn('Не загрузилась картинка:', url); resolve(null); };
    img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
  });
}

async function preloadAllImages() {
  console.log(`📸 Предзагрузка ${CONFIG.IMAGE_URLS.length} картинок...`);
  const results = await Promise.all(CONFIG.IMAGE_URLS.map(loadImage));
  const loaded = results.filter(Boolean).length;
  console.log(`📸 Загружено ${loaded} / ${CONFIG.IMAGE_URLS.length} картинок`);
}

/* ============================================================
   ТРАНСФОРМАЦИИ
   ============================================================ */
function getRandomTransform() {
  const tempo = tempoNorm;
  const scale = CONFIG.MIN_SCALE + Math.random() * (CONFIG.MAX_SCALE - CONFIG.MIN_SCALE);
  const rot = (Math.random() - 0.5) * (2 + tempo * 12);
  const maxShift = (scale - 1) * 50;
  const tx = (Math.random() - 0.5) * Math.min(5 + tempo * 30, maxShift);
  const ty = (Math.random() - 0.5) * Math.min(5 + tempo * 30, maxShift);
  const mirror = Math.random() < 0.2 ? -1 : 1;
  return { scale: scale * mirror, rawScale: scale, rot, tx, ty };
}

/* ============================================================
   ГЛАВНОЕ: плавная смена без чёрного
   ============================================================ */

/**
 * Возвращает слой, который СЕЙЧАС не видим (opacity < 0.01)
 * и не использовался последние LAYER_COOLDOWN_MS.
 * Если таких нет — принудительно берём наименее свежий,
 * но НЕ скрываем его — рисуем поверх (кросс-фейд).
 */
function pickFreeLayer() {
  const now = performance.now();
  const free = imgLayers.filter(l => {
    const op = parseFloat(l.canvas.style.opacity || '0');
    return op < 0.01 && (now - l.lastActive) > CONFIG.LAYER_COOLDOWN_MS;
  });
  if (free.length > 0) {
    // Из свободных берём самый давно использовавшийся
    free.sort((a, b) => a.lastActive - b.lastActive);
    return free[0];
  }
  // Все заняты — берём самый давний, но будем рисовать поверх (кросс-фейд)
  const sorted = imgLayers.slice().sort((a, b) => a.lastActive - b.lastActive);
  return sorted[0];
}

/**
 * Скрывает ВСЕ слои, кроме указанного — но плавно (через CSS transition),
 * и только когда новый слой уже виден.
 */
function fadeOutOthers(keepLayer, keepVideo) {
  // Картинки
  imgLayers.forEach(l => {
    if (l === keepLayer) return;
    if (parseFloat(l.canvas.style.opacity || '0') > 0.01) {
      l.canvas.style.opacity = '0';
    }
  });
  // Видео
  videoLayers.forEach(v => {
    if (v.el === keepVideo) return;
    if (parseFloat(v.el.style.opacity || '0') > 0.01) {
      v.el.style.opacity = '0';
    }
    // паузу НЕ ставим сразу — пусть кросс-фейд доиграет
    if (v.el !== keepVideo) {
      setTimeout(() => {
        if (v.el.style.opacity === '0' && !v.el.paused) v.el.pause();
      }, CONFIG.CROSSFADE_MS + 50);
    }
  });
}

/**
 * Показывает картинку с кросс-фейдом.
 */
async function showRandomImage() {
  const url = getNextImageUrl();
  const img = await loadImage(url);
  if (!img) {
    // Битый URL — пробуем следующую
    const alt = getNextImageUrl();
    const altImg = await loadImage(alt);
    if (!altImg) return;
    return showRandomImage(); // рекурсивно, пока не найдём рабочую
  }

  const layer = pickFreeLayer();
  if (!layer) return;

  layer.busy = true;
  layer.lastActive = performance.now();

  // Рисуем на canvas (пока он невидим или ещё видим — не важно)
  drawImageToLayer(layer, img, getRandomTransform());
  layer.currentImgUrl = url;

  // Применяем фильтр
  const filter = applyRandomFilter(layer.canvas);

  // КРОСС-ФЕЙД: сначала делаем новый слой видимым,
  // потом (через requestAnimationFrame) гасим остальные.
  layer.canvas.style.opacity = '1';
  layer.canvas.style.zIndex = '2';

  // Небольшая задержка, чтобы новый кадр точно успел отрисоваться
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      fadeOutOthers(layer, null);
      layer.canvas.style.zIndex = '1';
      layer.busy = false;
    });
  });

  console.log('🖼 Картинка:', url.split('/').pop().split('?')[0], '| фильтр:', filter.name);
}

/**
 * Показывает видео с кросс-фейдом.
 */
function showRandomVideo() {
  if (!videoLayers.length) return;

  // Выбираем видео, которое сейчас не видно
  const now = performance.now();
  const free = videoLayers.filter(v => {
    const op = parseFloat(v.el.style.opacity || '0');
    return op < 0.01 && (now - v.lastActive) > CONFIG.LAYER_COOLDOWN_MS;
  });

  let layer;
  if (free.length > 0) {
    layer = free[Math.floor(Math.random() * free.length)];
  } else {
    // Все заняты — берём случайное, будем кросс-фейдить
    layer = videoLayers[Math.floor(Math.random() * videoLayers.length)];
  }

  const video = layer.el;
  layer.lastActive = now;

  try {
    if (video.duration && isFinite(video.duration) && video.duration > 2) {
      video.currentTime = Math.random() * (video.duration - 1);
    }
  } catch (e) { /* ignore */ }

  video.muted = true;

  // Сначала запускаем, потом показываем — чтобы не было пустого кадра
  video.play().then(() => {
    // Видео реально играет — теперь можно показывать
    const t = getRandomTransform();
    video.style.transform =
      `scale(${t.scale}) rotate(${t.rot}deg) translate(${t.tx}%, ${t.ty}%)`;

    const filter = applyRandomFilter(video);

    video.style.opacity = '1';
    video.style.zIndex = '2';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        fadeOutOthers(null, video);
        video.style.zIndex = '1';
      });
    });

    console.log('🎬 Видео:', layer.url.split('/').pop(), '| фильтр:', filter.name);
  }).catch(err => {
    console.warn('Видео не запустилось:', err);
    // Не показываем видео — пусть останется предыдущий кадр
  });

  // Авто-переключение
  if (videoSwitchTimer) clearTimeout(videoSwitchTimer);
  const [minD, maxD] = CONFIG.VIDEO_CLIP_DURATION;
  const dur = minD + Math.random() * (maxD - minD);
  videoSwitchTimer = setTimeout(() => {
    if (isPlaying && !isPaused) showNextChaosFrame();
  }, dur);
}

/**
 * ГЛАВНАЯ: показывает следующий кадр (видео или картинка).
 * Никогда не оставляет чёрный экран: если что-то пошло не так,
 * предыдущий кадр остаётся видимым.
 */
function showNextChaosFrame() {
  const hasVideos = videoLayers.length > 0;
  const useVideo = hasVideos && Math.random() < CONFIG.VIDEO_PICK_CHANCE;

  if (Math.random() < 0.08 * (0.5 + tempoNorm)) triggerChaosFlash();
  if (isPlaying && !isPaused && Math.random() < CONFIG.TITLE_FLASH_ON_SWITCH) {
    flashTitleOnce();
  }

  if (useVideo) {
    showRandomVideo();
  } else {
    showRandomImage();
  }
}

/* ============================================================
   TITLE
   ============================================================ */
function getTitleForTrack(index) {
  const t = CONFIG.PLAYLIST[index];
  if (!t) return { title: 'NOW PLAYING', artist: '' };
  return {
    title: t.shortTitle || t.title || 'NOW PLAYING',
    artist: t.artist || '',
  };
}

function setTitleText(index) {
  const { title, artist } = getTitleForTrack(index);
  titleText.textContent = title;
  titleText.dataset.text = title;
  const sub = document.getElementById('titleSub');
  if (sub) sub.textContent = artist ? `now playing · ${artist}` : 'now playing';
  updateMediaSession();
}

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const t = CONFIG.PLAYLIST[currentTrack];
  if (!t) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title || t.shortTitle || 'Unknown',
      artist: t.artist || '',
      album: 'Chaotic Video Player',
      artwork: [{ src: 'https://picsum.photos/seed/cover' + currentTrack + '/512/512', sizes: '512x512', type: 'image/jpeg' }],
    });
    navigator.mediaSession.setActionHandler('play', () => { if (isPaused) togglePause(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!isPaused) togglePause(); });
    navigator.mediaSession.setActionHandler('previoustrack', () => {
      loadTrack(currentTrack - 1);
      if (isPlaying && !isPaused) audio.play().catch(() => {});
    });
    navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  } catch (e) { /* ignore */ }
}

function flashTitleOnce() {
  const tx = Math.random() < CONFIG.TITLE_OFFSET_CHANCE
    ? (Math.random() - 0.5) * 2 * CONFIG.TITLE_OFFSET_RANGE : 0;
  const ty = Math.random() < CONFIG.TITLE_OFFSET_CHANCE
    ? (Math.random() - 0.5) * 2 * CONFIG.TITLE_OFFSET_RANGE : 0;
  const rot = Math.random() < CONFIG.TITLE_ROTATE_CHANCE
    ? (Math.random() - 0.5) * 2 * CONFIG.TITLE_ROTATE_RANGE : 0;
  const sc = Math.random() < CONFIG.TITLE_SCALE_CHANCE
    ? CONFIG.TITLE_SCALE_RANGE[0] + Math.random() * (CONFIG.TITLE_SCALE_RANGE[1] - CONFIG.TITLE_SCALE_RANGE[0]) : 1;

  titleOverlay.style.transition = 'none';
  titleOverlay.style.transform =
    `translate(calc(-50% + ${tx}vw), calc(-50% + ${ty}vh)) rotate(${rot}deg) scale(${sc})`;
  titleOverlay.classList.remove('intro');
  titleOverlay.classList.add('visible');

  if (Math.random() < CONFIG.TITLE_GLITCH_ON_FLASH) {
    const gDur = CONFIG.TITLE_GLITCH_DURATION[0] +
      Math.random() * (CONFIG.TITLE_GLITCH_DURATION[1] - CONFIG.TITLE_GLITCH_DURATION[0]);
    triggerTitleGlitch(gDur);
  }

  const [minD, maxD] = CONFIG.TITLE_FLASH_DURATION;
  const dur = minD + Math.random() * (maxD - minD);
  const hideTimer = setTimeout(() => {
    titleOverlay.classList.remove('visible');
    titleOverlay.style.transition = 'opacity 0.15s ease';
    titleOverlay.style.transform = 'translate(-50%, -50%)';
    if (Math.random() < CONFIG.TITLE_DOUBLE_FLASH_CHANCE) {
      const gap = 40 + Math.random() * 120;
      const doubleTimer = setTimeout(() => {
        if (isPlaying && !isPaused) flashTitleOnce();
      }, gap);
      titleFlashTimers.push(doubleTimer);
    }
  }, dur);
  titleFlashTimers.push(hideTimer);
}

function showTitleIntro() {
  clearAllTitleTimers();
  titleOverlay.style.transition = 'none';
  titleOverlay.style.transform = 'translate(-50%, -50%)';
  titleOverlay.classList.remove('glitch', 'beat');
  titleOverlay.classList.add('visible', 'intro');
  const t1 = setTimeout(() => {
    titleOverlay.classList.remove('intro');
    scheduleNextTitleFlash();
  }, 2500);
  titleFlashTimers.push(t1);
}

function scheduleNextTitleFlash() {
  if (!isPlaying || isPaused) return;
  const minI = 400, maxI = 2500;
  const delay = maxI - (maxI - minI) * tempoNorm + Math.random() * 800;
  const t = setTimeout(() => {
    if (isPlaying && !isPaused) {
      flashTitleOnce();
      scheduleNextTitleFlash();
    }
  }, delay);
  titleFlashTimers.push(t);
}

function clearAllTitleTimers() {
  titleFlashTimers.forEach(t => clearTimeout(t));
  titleFlashTimers = [];
  if (titleBeatTimeout) { clearTimeout(titleBeatTimeout); titleBeatTimeout = null; }
  titleOverlay.classList.remove('visible', 'intro', 'glitch', 'beat');
  titleOverlay.style.transform = 'translate(-50%, -50%)';
  titleOverlay.style.transition = 'opacity 0.15s ease';
}

let glitchTimer = null;
function triggerTitleGlitch(durationMs = 150) {
  if (CONFIG.REDUCED_MOTION) return;
  titleOverlay.classList.add('glitch');
  if (glitchTimer) clearTimeout(glitchTimer);
  glitchTimer = setTimeout(() => {
    titleOverlay.classList.remove('glitch');
  }, durationMs);
}

/* ============================================================
   SPECTRUM
   ============================================================ */
function resizeSpectrum() {
  const dpr = window.devicePixelRatio || 1;
  const rect = spectrumCanvas.getBoundingClientRect();
  const w = Math.max(1, Math.floor(rect.width * dpr));
  const h = Math.max(1, Math.floor(rect.height * dpr));
  if (spectrumCanvas.width !== w || spectrumCanvas.height !== h) {
    spectrumCanvas.width = w;
    spectrumCanvas.height = h;
  }
}

function drawSpectrum() {
  resizeSpectrum();
  const W = spectrumCanvas.width;
  const H = spectrumCanvas.height;
  spectrumCtx.clearRect(0, 0, W, H);

  const bars = CONFIG.SPECTRUM_BARS;
  const barWidth = W / bars;
  const gap = Math.max(1, barWidth * 0.15);
  const heightChaos = 1 + tempoNorm * 0.3;

  for (let i = 0; i < bars; i++) {
    const v = spectrumValues[i];
    const boost = 1 + (i / bars) * 0.5;
    const barH = Math.min(H, v * H * 0.95 * boost * heightChaos + beatPulse * H * 0.1);
    const x = i * barWidth;
    const y = H - barH;
    const hue = 260 - (i / bars) * 260 + (highPulse * 30) + (Math.random() * 20 - 10);
    const sat = 100;
    const light = 45 + v * 35 + highPulse * 15;

    const grad = spectrumCtx.createLinearGradient(0, H, 0, y);
    grad.addColorStop(0, `hsla(${hue}, ${sat}%, ${light * 0.4}%, 0.15)`);
    grad.addColorStop(0.4, `hsla(${hue}, ${sat}%, ${light}%, 0.7)`);
    grad.addColorStop(1, `hsla(${hue}, ${sat}%, ${Math.min(95, light + 15)}%, 1)`);
    spectrumCtx.fillStyle = grad;
    spectrumCtx.fillRect(x + gap / 2, y, barWidth - gap, barH);

    spectrumCtx.fillStyle = `hsla(${hue}, 100%, 85%, ${0.6 + v * 0.4})`;
    spectrumCtx.fillRect(x + gap / 2, y - 2, barWidth - gap, 2);
  }

  spectrumCtx.globalCompositeOperation = 'screen';
  spectrumCtx.globalAlpha = 0.25;
  for (let i = 0; i < bars; i++) {
    const v = spectrumValues[i];
    const barH = Math.min(H * 0.6, v * H * 0.45);
    const x = i * barWidth;
    const hue = 260 - (i / bars) * 260;
    spectrumCtx.fillStyle = `hsla(${hue}, 100%, 60%, 0.3)`;
    spectrumCtx.fillRect(x + gap / 2, 0, barWidth - gap, barH);
  }
  spectrumCtx.globalAlpha = 1;
  spectrumCtx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   ХАОС-ВСПЫШКА
   ============================================================ */
function triggerChaosFlash() {
  if (CONFIG.REDUCED_MOTION) return;
  const hue = Math.random() * 360;
  chaosFlash.style.background = `linear-gradient(${Math.random()*360}deg,
    hsla(${hue}, 100%, 65%, 0.35),
    hsla(${(hue + 120) % 360}, 100%, 65%, 0.25))`;
  chaosFlash.style.opacity = '1';
  setTimeout(() => { chaosFlash.style.opacity = '0'; }, 60 + Math.random() * 100);
}

/* ============================================================
   АНИМАЦИЯ
   ============================================================ */
function animate(now) {
  const dt = now - lastFrameTime;
  const minInterval = 1000 / CONFIG.MAX_FPS;
  if (dt >= minInterval) {
    lastFrameTime = now;
    updateAudioEnergy(now);
    drawSpectrum();

    if (activeVideoEl && !CONFIG.REDUCED_MOTION) {
      const pulse = 1 + beatPulse * 0.05 + bassEnergy * 0.03;
      const cur = activeVideoEl.style.transform.match(/scale\(([\d.-]+)/);
      if (cur) {
        const baseScale = Math.abs(parseFloat(cur[1]));
        const newScale = Math.max(CONFIG.MIN_SCALE, baseScale) * pulse;
        activeVideoEl.style.transform = activeVideoEl.style.transform.replace(
          /scale\(([\d.-]+)(?:,\s*([\d.-]+))?\)/,
          `scale(${newScale}, ${newScale})`
        );
      }
    }

    if (!CONFIG.REDUCED_MOTION) {
      imgLayers.forEach(l => {
        if (l.canvas.style.opacity === '1' && Math.random() < 0.05) {
          const pulse = 1 + beatPulse * 0.05 + bassEnergy * 0.03;
          l.canvas.style.transform = l.canvas.style.transform.replace(
            /scale\(([\d.]+)(?:,\s*([\d.]+))?\)/,
            (m, sx, sy) => {
              const s1 = Math.max(CONFIG.MIN_SCALE, parseFloat(sx) * pulse);
              const s2 = Math.max(CONFIG.MIN_SCALE, parseFloat(sy || sx) * pulse);
              return `scale(${s1}, ${s2})`;
            }
          );
        }
      });
    }
  }
  animationFrame = requestAnimationFrame(animate);
}

function startChaos() {
  stopChaos();
  scheduleFlicker();
  lastFrameTime = 0;
  animationFrame = requestAnimationFrame(animate);
}

function scheduleFlicker() {
  if (CONFIG.REDUCED_MOTION) {
    flickerTimer = setTimeout(() => {
      showNextChaosFrame();
      scheduleFlicker();
    }, 800);
    return;
  }
  const jitter = 0.3 + tempoNorm * 0.7;
  const delay = nextFlickerDelay * (0.7 + Math.random() * jitter * 0.6);
  flickerTimer = setTimeout(() => {
    const switchChance = 0.7 + tempoNorm * 0.25;
    if (Math.random() < switchChance) {
      showNextChaosFrame();
      if (Math.random() < CONFIG.DOUBLE_SWITCH_CHANCE) {
        setTimeout(() => {
          if (isPlaying && !isPaused) showNextChaosFrame();
        }, 30 + Math.random() * 80);
      }
    }
    scheduleFlicker();
  }, delay);
}

function stopChaos() {
  if (flickerTimer) { clearTimeout(flickerTimer); flickerTimer = null; }
  if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
}

/* ============================================================
   АУДИО
   ============================================================ */
function loadTrack(index) {
  currentTrack = ((index % CONFIG.PLAYLIST.length) + CONFIG.PLAYLIST.length) % CONFIG.PLAYLIST.length;
  audio.src = CONFIG.PLAYLIST[currentTrack].src;
  audio.load();
  setTitleText(currentTrack);
  console.log('🎵 Загрузка трека:', CONFIG.PLAYLIST[currentTrack].title);
  resetTempo();
}

function resetTempo() {
  bpmSmooth = 0; tempoNorm = 0;
  beatIntervals = []; eventTimes = []; eventDensity = 0;
  tempoLocked = false;
}

function nextTrack() {
  const prevTrack = currentTrack;
  loadTrack(currentTrack + 1);
  if (prevTrack === currentTrack && CONFIG.PLAYLIST.length === 1) audio.currentTime = 0;
  clearAllTitleTimers();
  if (isPlaying && !isPaused) {
    audio.play().catch(() => {});
    showTitleIntro();
  } else {
    setTitleText(currentTrack);
  }
}

audio.addEventListener('error', () => {
  const err = audio.error;
  if (!err) return;
  console.warn('❌ Ошибка аудио:', err.code, err.message);
  if (err.code === 4) {
    audioWarnEl.textContent = '⚠ трек недоступен — проверь консоль';
    audioWarnEl.classList.add('visible');
    setTimeout(() => audioWarnEl.classList.remove('visible'), 6000);
  }
});

audio.addEventListener('play', () => {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
audio.addEventListener('pause', () => {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = isPaused ? 'paused' : 'playing';
});

/* ============================================================
   ПОКАЗ/СКРЫТИЕ UI
   ============================================================ */
function showStatusTemporarily(ms = CONFIG.STATUS_HIDE_DELAY) {
  statusEl.classList.add('visible');
  if (statusHideTimer) clearTimeout(statusHideTimer);
  statusHideTimer = setTimeout(() => { statusEl.classList.remove('visible'); }, ms);
}

function showProgressTemporarily(ms = 2500) {
  progressWrap.classList.add('visible');
  if (progressHideTimer) clearTimeout(progressHideTimer);
  progressHideTimer = setTimeout(() => { progressWrap.classList.remove('visible'); }, ms);
}

/* ============================================================
   PLAY / PAUSE
   ============================================================ */
function startPlayback() {
  if (isPlaying) return;
  isPlaying = true;
  isPaused = false;

  initAnalyser();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  playBtn.classList.add('hidden');
  showStatusTemporarily(CONFIG.STATUS_HIDE_DELAY);
  showProgressTemporarily(2500);
  spectrumWrap.classList.add('visible');

  hintEl.classList.add('visible');
  setTimeout(() => hintEl.classList.remove('visible'), 4000);

  if (!audio.src) loadTrack(0);
  setTitleText(currentTrack);

  audio.play().catch(err => {
    console.warn('⚠ play() failed:', err);
    if (currentTrack !== 1 && CONFIG.PLAYLIST.length > 1) {
      loadTrack(1);
      audio.play().catch(() => {});
    }
  });

  // Показываем ПЕРВЫЙ кадр синхронно — до старта ротации
  // чтобы не было даже мгновения пустого экрана
  showNextChaosFrame();

  // Запускаем хаос с небольшой задержкой,
  // чтобы первый кадр успел отрисоваться и стать видимым
  setTimeout(() => {
    if (isPlaying && !isPaused) startChaos();
  }, CONFIG.CROSSFADE_MS);

  showTitleIntro();
}

function togglePause() {
  if (!isPlaying) return;
  isPaused = !isPaused;
  if (isPaused) {
    audio.pause();
    pauseOverlay.classList.add('visible');
    showStatusTemporarily(99999999);
    progressWrap.classList.add('visible');
    if (progressHideTimer) { clearTimeout(progressHideTimer); progressHideTimer = null; }
    clearAllTitleTimers();
    titleOverlay.classList.remove('intro', 'glitch', 'beat');
    titleOverlay.style.transform = 'translate(-50%, -50%)';
    titleOverlay.classList.add('visible');
    if (activeVideoEl) activeVideoEl.pause();
  } else {
    audio.play().catch(() => {});
    if (activeVideoEl) activeVideoEl.play().catch(() => {});
    pauseOverlay.classList.remove('visible');
    showStatusTemporarily(CONFIG.STATUS_HIDE_DELAY);
    showProgressTemporarily(2500);
    clearAllTitleTimers();
    scheduleNextTitleFlash();
  }
}

playBtn.addEventListener('click', startPlayback);
pauseOverlay.addEventListener('click', togglePause);
nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextTrack(); });

/* ============================================================
   ЖЕСТЫ
   ============================================================ */
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let lastTapTime = 0;
let tapTimer = null;

stage.addEventListener('click', () => {
  if (!isPlaying) return;
  const now = Date.now();
  if (now - lastTapTime < 300) {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    lastTapTime = 0;
    togglePause();
    return;
  }
  lastTapTime = now;
  tapTimer = setTimeout(() => {
    showNextChaosFrame();
    tapTimer = null;
  }, 300);
});

stage.addEventListener('touchstart', (e) => {
  if (!e.touches[0]) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, { passive: true });

stage.addEventListener('touchend', (e) => {
  if (!e.changedTouches[0] || !isPlaying) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 600) {
    const activeImg = imgLayers.find(l => l.canvas.style.opacity === '1');
    if (activeImg) applyRandomFilter(activeImg.canvas);
    if (activeVideoEl) applyRandomFilter(activeVideoEl);
    stage.style.filter = 'brightness(1.5)';
    setTimeout(() => stage.style.filter = '', 100);
  }
}, { passive: true });

/* ============================================================
   ПРОГРЕСС
   ============================================================ */
stage.addEventListener('mousemove', () => {
  if (!isPlaying) return;
  showProgressTemporarily(2000);
});

progressWrap.addEventListener('mouseenter', () => {
  if (progressHideTimer) { clearTimeout(progressHideTimer); progressHideTimer = null; }
  progressWrap.classList.add('visible');
});
progressWrap.addEventListener('mouseleave', () => {
  if (isPlaying && !isPaused) showProgressTemporarily(1500);
});

function formatTime(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 0;
  progressFill.style.width = dur ? `${(cur / dur) * 100}%` : '0%';
  timeLabel.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
});

audio.addEventListener('loadedmetadata', () => {
  timeLabel.textContent = `0:00 / ${formatTime(audio.duration)}`;
});

audio.addEventListener('ended', nextTrack);
audio.addEventListener('playing', () => console.log('🎶 Играет'));

progressBar.addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const p = (e.clientX - rect.left) / rect.width;
  audio.currentTime = p * audio.duration;
  showProgressTemporarily(2000);
});

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
async function init() {
  for (let i = 0; i < CONFIG.IMG_LAYERS_COUNT; i++) {
    imgLayers.push(createImageLayer());
  }

  await preloadAllImages();
  refillImageQueue();

  initVideoLayers();
  loadTrack(0);
  setTitleText(0);

  console.log('✅ Готово');
  console.log('📸 Картинок в ротации:', CONFIG.IMAGE_URLS.length);
  console.log('🎬 Видео в ротации:', videoLayers.length);
  console.log('🛡 Защита от чёрного: яркая подложка + кросс-фейд + 4 слоя');
}

init();

window.addEventListener('resize', () => {
  resizeSpectrum();
  updateImageLayersResolution();
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    updateMediaSession();
    if (isPlaying && !isPaused && audio.paused) audio.play().catch(() => {});
    if (isPlaying && !isPaused && activeVideoEl && activeVideoEl.paused) activeVideoEl.play().catch(() => {});
  }
});

document.addEventListener('click', function once() {
  initAnalyser();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  document.removeEventListener('click', once);
}, { once: true });

</script>
