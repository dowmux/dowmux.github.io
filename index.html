<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Calendar - Event Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --border: #dee2e6;
            --today: #ffd6d6;
            --event: #e9ecef;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 28px;
            color: var(--primary);
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .user-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: rgba(67, 97, 238, 0.1);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .calendar-container {
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .calendar-nav-btn {
            background: var(--light);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-nav-btn:hover {
            background: var(--primary);
            color: white;
        }

        .current-month {
            font-size: 20px;
            font-weight: 600;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--gray);
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .calendar-day:hover {
            background: var(--light);
        }

        .calendar-day.other-month {
            color: var(--gray);
            opacity: 0.5;
        }

        .calendar-day.today {
            background: var(--today);
            font-weight: 600;
        }

        .calendar-day.selected {
            background: var(--primary);
            color: white;
        }

        .calendar-day.has-events::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
        }

        .events-container {
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .events-date {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--primary);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .event-item {
            padding: 15px;
            border-radius: 10px;
            background: var(--event);
            border-left: 4px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-info {
            flex: 1;
        }

        .event-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .event-time {
            font-size: 14px;
            color: var(--gray);
        }

        .event-actions {
            display: flex;
            gap: 10px;
        }

        .event-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray);
            transition: all 0.2s;
        }

        .event-action-btn:hover {
            color: var(--primary);
        }

        .event-action-btn.delete:hover {
            color: var(--danger);
        }

        .no-events {
            text-align: center;
            padding: 20px;
            color: var(--gray);
        }

        .event-form-container {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .time-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left: 4px solid var(--success);
        }

        .notification.error {
            border-left: 4px solid var(--danger);
        }

        .notification-icon {
            font-size: 20px;
        }

        .notification.success .notification-icon {
            color: var(--success);
        }

        .notification.error .notification-icon {
            color: var(--danger);
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 576px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            
            .user-actions {
                width: 100%;
                justify-content: center;
            }
            
            .time-inputs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-calendar-alt"></i>
                <h1>Daily Calendar</h1>
            </div>
            <div class="user-actions">
                <button class="btn btn-outline" id="exportBtn">
                    <i class="fas fa-download"></i> Export Events
                </button>
                <button class="btn btn-outline" id="importBtn">
                    <i class="fas fa-upload"></i> Import Events
                </button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </header>

        <div class="main-content">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Calendar</div>
                </div>
                <div class="calendar-container">
                    <div class="calendar-header">
                        <div class="calendar-nav">
                            <button class="calendar-nav-btn" id="prevMonth">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <button class="calendar-nav-btn" id="todayBtn">
                                Today
                            </button>
                            <button class="calendar-nav-btn" id="nextMonth">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                        <div class="current-month" id="currentMonth">September 2023</div>
                    </div>
                    
                    <div class="calendar-weekdays">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    
                    <div class="calendar-days" id="calendarDays">
                        <!-- Calendar days will be generated here -->
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title" id="eventsDateTitle">Events for Today</div>
                </div>
                <div class="events-container">
                    <div class="events-date" id="eventsDate">Today, September 15, 2023</div>
                    <div class="events-list" id="eventsList">
                        <!-- Events will be displayed here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Add New Event</div>
            </div>
            <div class="event-form-container">
                <form id="eventForm">
                    <div class="form-group">
                        <label class="form-label" for="eventTitle">Event Title</label>
                        <input type="text" class="form-control" id="eventTitle" placeholder="Enter event title" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="eventDate">Date</label>
                        <input type="date" class="form-control" id="eventDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Time</label>
                        <div class="time-inputs">
                            <div>
                                <label class="form-label" for="startTime">Start Time</label>
                                <input type="time" class="form-control" id="startTime" required>
                            </div>
                            <div>
                                <label class="form-label" for="endTime">End Time</label>
                                <input type="time" class="form-control" id="endTime" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="eventDescription">Description (Optional)</label>
                        <textarea class="form-control" id="eventDescription" rows="3" placeholder="Enter event description"></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Event</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="notification" id="notification">
            <i class="fas fa-check-circle notification-icon"></i>
            <div class="notification-message">Event saved successfully!</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const calendarDays = document.getElementById('calendarDays');
            const currentMonthEl = document.getElementById('currentMonth');
            const eventsDateTitle = document.getElementById('eventsDateTitle');
            const eventsDate = document.getElementById('eventsDate');
            const eventsList = document.getElementById('eventsList');
            const eventForm = document.getElementById('eventForm');
            const eventTitle = document.getElementById('eventTitle');
            const eventDate = document.getElementById('eventDate');
            const startTime = document.getElementById('startTime');
            const endTime = document.getElementById('endTime');
            const eventDescription = document.getElementById('eventDescription');
            const prevMonthBtn = document.getElementById('prevMonth');
            const nextMonthBtn = document.getElementById('nextMonth');
            const todayBtn = document.getElementById('todayBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const importFile = document.getElementById('importFile');
            const notification = document.getElementById('notification');

            // Calendar state
            let currentDate = new Date();
            let selectedDate = new Date();
            let events = JSON.parse(localStorage.getItem('calendarEvents')) || [];

            // Initialize the calendar
            function initCalendar() {
                renderCalendar();
                renderEvents();
                setFormDate(selectedDate);
                
                // Set today's date as default in the form
                const today = new Date();
                eventDate.value = formatDateForInput(today);
            }

            // Render the calendar
            function renderCalendar() {
                calendarDays.innerHTML = '';
                
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                
                // Update the current month display
                currentMonthEl.textContent = currentDate.toLocaleDateString('en-US', { 
                    month: 'long', 
                    year: 'numeric' 
                });
                
                // Get the first day of the month and the number of days
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                
                // Get the day of the week for the first day (0 = Sunday, 6 = Saturday)
                const firstDayIndex = firstDay.getDay();
                
                // Get the last day of the previous month
                const prevLastDay = new Date(year, month, 0).getDate();
                
                // Render previous month's days
                for (let i = firstDayIndex; i > 0; i--) {
                    const day = prevLastDay - i + 1;
                    const dayElement = document.createElement('div');
                    dayElement.className = 'calendar-day other-month';
                    dayElement.textContent = day;
                    calendarDays.appendChild(dayElement);
                }
                
                // Render current month's days
                for (let i = 1; i <= daysInMonth; i++) {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'calendar-day';
                    dayElement.textContent = i;
                    
                    // Create a date object for this day
                    const dayDate = new Date(year, month, i);
                    
                    // Check if this day is today
                    if (isToday(dayDate)) {
                        dayElement.classList.add('today');
                    }
                    
                    // Check if this day is selected
                    if (isSameDay(dayDate, selectedDate)) {
                        dayElement.classList.add('selected');
                    }
                    
                    // Check if this day has events
                    if (hasEvents(dayDate)) {
                        dayElement.classList.add('has-events');
                    }
                    
                    // Add click event
                    dayElement.addEventListener('click', function() {
                        selectDate(dayDate);
                    });
                    
                    calendarDays.appendChild(dayElement);
                }
                
                // Calculate how many next month days to show
                const totalCells = 42; // 6 rows x 7 columns
                const daysSoFar = firstDayIndex + daysInMonth;
                const nextDays = totalCells - daysSoFar;
                
                // Render next month's days
                for (let i = 1; i <= nextDays; i++) {
                    const dayElement = document.createElement('div');
                    dayElement.className = 'calendar-day other-month';
                    dayElement.textContent = i;
                    calendarDays.appendChild(dayElement);
                }
            }

            // Render events for the selected date
            function renderEvents() {
                eventsList.innerHTML = '';
                
                // Update the events header
                eventsDateTitle.textContent = `Events for ${formatDate(selectedDate)}`;
                eventsDate.textContent = formatDateFull(selectedDate);
                
                // Filter events for the selected date
                const dayEvents = events.filter(event => 
                    isSameDay(new Date(event.date), selectedDate)
                );
                
                // Sort events by start time
                dayEvents.sort((a, b) => a.startTime.localeCompare(b.startTime));
                
                if (dayEvents.length === 0) {
                    eventsList.innerHTML = `
                        <div class="no-events">
                            <i class="fas fa-calendar-times" style="font-size: 40px; margin-bottom: 10px;"></i>
                            <p>No events scheduled for this day</p>
                        </div>
                    `;
                    return;
                }
                
                // Render each event
                dayEvents.forEach((event, index) => {
                    const eventElement = document.createElement('div');
                    eventElement.className = 'event-item';
                    eventElement.innerHTML = `
                        <div class="event-info">
                            <div class="event-title">${event.title}</div>
                            <div class="event-time">${formatTime(event.startTime)} - ${formatTime(event.endTime)}</div>
                            ${event.description ? `<div class="event-description">${event.description}</div>` : ''}
                        </div>
                        <div class="event-actions">
                            <button class="event-action-btn edit" data-index="${index}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="event-action-btn delete" data-index="${index}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    eventsList.appendChild(eventElement);
                });
                
                // Add event listeners for edit and delete buttons
                document.querySelectorAll('.event-action-btn.edit').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        editEvent(dayEvents[index]);
                    });
                });
                
                document.querySelectorAll('.event-action-btn.delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        deleteEvent(dayEvents[index]);
                    });
                });
            }

            // Select a date
            function selectDate(date) {
                selectedDate = new Date(date);
                renderCalendar();
                renderEvents();
                setFormDate(selectedDate);
            }

            // Set form date
            function setFormDate(date) {
                eventDate.value = formatDateForInput(date);
            }

            // Check if a date is today
            function isToday(date) {
                const today = new Date();
                return isSameDay(date, today);
            }

            // Check if two dates are the same day
            function isSameDay(date1, date2) {
                return date1.getDate() === date2.getDate() &&
                       date1.getMonth() === date2.getMonth() &&
                       date1.getFullYear() === date2.getFullYear();
            }

            // Check if a date has events
            function hasEvents(date) {
                return events.some(event => isSameDay(new Date(event.date), date));
            }

            // Format date for display
            function formatDate(date) {
                if (isToday(date)) {
                    return 'Today';
                }
                
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                if (isSameDay(date, tomorrow)) {
                    return 'Tomorrow';
                }
                
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (isSameDay(date, yesterday)) {
                    return 'Yesterday';
                }
                
                return date.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    month: 'short', 
                    day: 'numeric' 
                });
            }

            // Format date fully for display
            function formatDateFull(date) {
                return date.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            }

            // Format date for input field
            function formatDateForInput(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            // Format time for display
            function formatTime(timeString) {
                const [hours, minutes] = timeString.split(':');
                const hour = parseInt(hours);
                const ampm = hour >= 12 ? 'PM' : 'AM';
                const displayHour = hour % 12 || 12;
                return `${displayHour}:${minutes} ${ampm}`;
            }

            // Show notification
            function showNotification(message, isError = false) {
                const icon = notification.querySelector('.notification-icon');
                const messageEl = notification.querySelector('.notification-message');
                
                messageEl.textContent = message;
                notification.className = 'notification';
                notification.classList.add(isError ? 'error' : 'success');
                notification.classList.add('show');
                
                icon.className = 'notification-icon';
                icon.classList.add(isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }

            // Save events to localStorage
            function saveEvents() {
                localStorage.setItem('calendarEvents', JSON.stringify(events));
            }

            // Add a new event
            function addEvent(event) {
                events.push(event);
                saveEvents();
                renderCalendar();
                renderEvents();
                showNotification('Event added successfully!');
            }

            // Edit an existing event
            function editEvent(event) {
                // For simplicity, we'll prefill the form and then delete the old event when saving
                eventTitle.value = event.title;
                eventDate.value = event.date;
                startTime.value = event.startTime;
                endTime.value = event.endTime;
                eventDescription.value = event.description || '';
                
                // Scroll to form
                document.querySelector('.event-form-container').scrollIntoView({ behavior: 'smooth' });
                
                // Remove the event (will be re-added when form is submitted)
                deleteEvent(event, false);
            }

            // Delete an event
            function deleteEvent(event, showNotification = true) {
                events = events.filter(e => 
                    !(e.title === event.title && 
                      e.date === event.date && 
                      e.startTime === event.startTime)
                );
                
                saveEvents();
                renderCalendar();
                renderEvents();
                
                if (showNotification) {
                    showNotification('Event deleted successfully!');
                }
            }

            // Export events to JSON file
            function exportEvents() {
                const dataStr = JSON.stringify(events, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(dataBlob);
                link.download = 'calendar-events.json';
                link.click();
                
                showNotification('Events exported successfully!');
            }

            // Import events from JSON file
            function importEvents(file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        const importedEvents = JSON.parse(e.target.result);
                        
                        if (Array.isArray(importedEvents)) {
                            events = importedEvents;
                            saveEvents();
                            renderCalendar();
                            renderEvents();
                            showNotification('Events imported successfully!');
                        } else {
                            showNotification('Invalid file format', true);
                        }
                    } catch (error) {
                        showNotification('Error importing events', true);
                        console.error(error);
                    }
                };
                
                reader.readAsText(file);
            }

            // Event Listeners
            prevMonthBtn.addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            todayBtn.addEventListener('click', function() {
                currentDate = new Date();
                selectDate(currentDate);
            });

            cancelBtn.addEventListener('click', function() {
                eventForm.reset();
                setFormDate(selectedDate);
            });

            eventForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Validate time
                if (startTime.value >= endTime.value) {
                    showNotification('End time must be after start time', true);
                    return;
                }
                
                const newEvent = {
                    title: eventTitle.value,
                    date: eventDate.value,
                    startTime: startTime.value,
                    endTime: endTime.value,
                    description: eventDescription.value
                };
                
                addEvent(newEvent);
                eventForm.reset();
                setFormDate(selectedDate);
            });

            exportBtn.addEventListener('click', exportEvents);

            importBtn.addEventListener('click', function() {
                importFile.click();
            });

            importFile.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    importEvents(e.target.files[0]);
                    // Reset the file input
                    e.target.value = '';
                }
            });

            // Initialize the application
            initCalendar();
        });
    </script>
</body>
</html>
