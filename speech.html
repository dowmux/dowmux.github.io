<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Русские субтитры — лента и бегущая строка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --controls-height: 124px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --font-size: 26px;
        }

        html, body {
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100%;
            width: 100%;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        #subtitles-window {
            position: fixed;
            left: 0;
            right: 0;
            top: calc(28px + var(--safe-top));
            bottom: calc(var(--controls-height) + var(--safe-bottom) + 4px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px 16px 8px;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 12%);
            pointer-events: none;
        }

        #lines {
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.25s ease;
            will-change: transform;
        }

        .sub-line {
            font-size: var(--font-size);
            line-height: 1.22;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.95);
            word-wrap: break-word;
            overflow-wrap: anywhere;
            opacity: 0;
            transform: translateY(16px);
            animation: lineIn 0.2s ease forwards;
        }

        .sub-line:not(:last-child) { color: #b8b8b8; }
        .sub-line:last-child { color: #ffffff; }
        .sub-line.interim { color: #9aa0a6; font-style: italic; }

        @keyframes lineIn {
            to { opacity: 1; transform: translateY(0); }
        }

        #marquee-container {
            display: none;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            align-self: center;
        }

        #marquee-container.active { display: block; }

        #marquee-text {
            display: inline-block;
            font-size: var(--font-size);
            line-height: 1.3;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.95);
            padding-left: 0;
            will-change: transform;
        }

        @keyframes marqueeScroll {
            0%   { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        body.marquee-mode #lines { display: none; }
        body.marquee-mode #subtitles-window { justify-content: center; }

        .controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--controls-height);
            padding: 8px 12px calc(8px + var(--safe-bottom));
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6));
            z-index: 10;
        }

        button {
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 13px;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
            padding: 0 8px;
        }
        button:active { opacity: 0.75; transform: scale(0.97); }

        #startBtn { background: #007aff; grid-column: 1 / 2; grid-row: 1 / 2; }
        #startBtn.listening { background: #ff3b30; }
        #clearBtn { background: #3a3a3c; grid-column: 2 / 4; grid-row: 1 / 2; }
        #marqueeBtn { background: #5856d6; grid-column: 1 / 4; grid-row: 2 / 3; }
        #marqueeBtn.active { background: #34c759; }

        #status {
            position: fixed;
            top: calc(4px + var(--safe-top));
            left: 0;
            right: 0;
            font-size: 12px;
            color: #777;
            text-align: center;
            padding: 0 16px;
            z-index: 5;
            pointer-events: none;
        }

        #measure {
            position: absolute;
            visibility: hidden;
            white-space: nowrap;
            font-size: var(--font-size);
            font-weight: 600;
            font-family: system-ui, -apple-system, sans-serif;
            left: -9999px;
            top: 0;
        }

        @media (orientation: landscape) {
            :root {
                --controls-height: 104px;
                --font-size: 30px;
            }
            button { font-size: 14px; }
        }

        @media (max-width: 360px) {
            button { font-size: 13px; }
            :root { --font-size: 23px; }
        }
    </style>
</head>
<body>

    <div id="status">Нажмите «Начать» для распознавания русской речи</div>

    <div id="subtitles-window">
        <div id="lines"></div>
        <div id="marquee-container">
            <span id="marquee-text"></span>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn">Начать</button>
        <button id="clearBtn">Очистить</button>
        <button id="marqueeBtn">Бегущая строка: выкл</button>
    </div>

    <span id="measure"></span>

    <script>
        (function() {
            const statusEl      = document.getElementById('status');
            const linesEl       = document.getElementById('lines');
            const marqueeCont   = document.getElementById('marquee-container');
            const marqueeTextEl = document.getElementById('marquee-text');
            const measureEl     = document.getElementById('measure');
            const startBtn      = document.getElementById('startBtn');
            const clearBtn      = document.getElementById('clearBtn');
            const marqueeBtn    = document.getElementById('marqueeBtn');
            const windowEl      = document.getElementById('subtitles-window');

            let recognition = null;
            let isListening = false;
            let marqueeMode = false;

            let finalText = '';
            let interimText = '';

            const MAX_LINES = 8;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusEl.textContent = 'Браузер не поддерживает распознавание речи. Используйте Chrome или Safari.';
                startBtn.disabled = true;
                return;
            }

            function getMaxTextWidth() {
                return windowEl.clientWidth - 32;
            }

            function normalize(word) {
                return word.toLowerCase().replace(/[.,!?;:—–]/g, '');
            }

            function wrapText(text, maxWidth) {
                const words = text.split(/\s+/).filter(Boolean);
                const lines = [];
                let current = '';
                for (const word of words) {
                    const test = current ? current + ' ' + word : word;
                    measureEl.textContent = test;
                    if (measureEl.offsetWidth <= maxWidth || !current) {
                        current = test;
                    } else {
                        lines.push(current);
                        current = word;
                    }
                }
                if (current) lines.push(current);
                return lines;
            }

            function scrollToBottom() {
                const overflow = linesEl.scrollHeight - windowEl.clientHeight + 8;
                linesEl.style.transform = overflow > 0 ? `translateY(-${overflow}px)` : 'translateY(0)';
            }

            function mergeWithoutDuplicates(finalPart, interimPart) {
                if (!interimPart) return finalPart;
                if (!finalPart) return interimPart;

                const finalWords = finalPart.trim().split(/\s+/);
                const interimWords = interimPart.trim().split(/\s+/);

                const maxCheck = Math.min(finalWords.length, interimWords.length);
                let overlap = 0;
                for (let len = maxCheck; len > 0; len--) {
                    const tail = finalWords.slice(-len).map(normalize);
                    const head = interimWords.slice(0, len).map(normalize);
                    let match = true;
                    for (let i = 0; i < len; i++) {
                        if (tail[i] !== head[i]) { match = false; break; }
                    }
                    if (match) { overlap = len; break; }
                }

                const newInterim = interimWords.slice(overlap);
                if (!newInterim.length) return finalPart;
                return finalPart.trim() + ' ' + newInterim.join(' ');
            }

            function renderLines() {
                linesEl.innerHTML = '';

                const combined = mergeWithoutDuplicates(finalText, interimText);
                if (!combined.trim()) { linesEl.style.transform = 'translateY(0)'; return; }

                const lines = wrapText(combined, getMaxTextWidth());

                for (const lineText of lines) {
                    const div = document.createElement('div');
                    div.className = 'sub-line';
                    div.textContent = lineText;
                    linesEl.appendChild(div);
                }

                if (interimText) {
                    const last = linesEl.lastElementChild;
                    if (last) last.classList.add('interim');
                }

                while (linesEl.children.length > MAX_LINES) {
                    linesEl.removeChild(linesEl.firstChild);
                }
                requestAnimationFrame(scrollToBottom);
            }

            function renderMarquee() {
                const combined = mergeWithoutDuplicates(finalText, interimText);
                if (!combined.trim()) {
                    marqueeTextEl.textContent = '';
                    marqueeTextEl.style.animation = 'none';
                    return;
                }
                marqueeTextEl.textContent = combined;

                const charsPerSecond = 8;
                const duration = Math.max(10, combined.length / charsPerSecond);

                marqueeTextEl.style.animation = 'none';
                void marqueeTextEl.offsetWidth;
                marqueeTextEl.style.animation = `marqueeScroll ${duration}s linear infinite`;
            }

            function renderAll() {
                if (marqueeMode) renderMarquee();
                else renderLines();
            }

            function clearAll() {
                finalText = '';
                interimText = '';
                linesEl.innerHTML = '';
                linesEl.style.transform = 'translateY(0)';
                marqueeTextEl.textContent = '';
                marqueeTextEl.style.animation = 'none';
            }

            function toggleMarqueeMode() {
                marqueeMode = !marqueeMode;
                if (marqueeMode) {
                    document.body.classList.add('marquee-mode');
                    marqueeCont.classList.add('active');
                    marqueeBtn.textContent = 'Бегущая строка: вкл';
                    marqueeBtn.classList.add('active');
                    renderMarquee();
                } else {
                    document.body.classList.remove('marquee-mode');
                    marqueeCont.classList.remove('active');
                    marqueeBtn.textContent = 'Бегущая строка: выкл';
                    marqueeBtn.classList.remove('active');
                    renderLines();
                }
                statusEl.textContent = marqueeMode ? 'Режим бегущей строки включён' : 'Обычный режим';
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                let newFinal = '';
                let currentInterim = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        newFinal += transcript + ' ';
                    } else {
                        currentInterim = transcript;
                    }
                }

                if (newFinal.trim()) {
                    finalText = mergeWithoutDuplicates(finalText, newFinal.trim());
                    interimText = '';
                } else if (currentInterim) {
                    interimText = currentInterim;
                }

                renderAll();
            };

            recognition.onerror = function(e) {
                console.error(e);
                if (e.error === 'not-allowed') statusEl.textContent = 'Доступ к микрофону запрещён.';
                else if (e.error === 'no-speech') statusEl.textContent = 'Речь не обнаружена, слушаю...';
            };

            recognition.onend = function() {
                if (isListening) { try { recognition.start(); } catch(e) {} }
            };

            startBtn.addEventListener('click', function() {
                if (!isListening) {
                    isListening = true;
                    startBtn.textContent = 'Остановить';
                    startBtn.classList.add('listening');
                    statusEl.textContent = 'Слушаю... Говорите по-русски.';
                    try { recognition.start(); } catch(e) {}
                } else {
                    isListening = false;
                    recognition.stop();
                    startBtn.textContent = 'Начать';
                    startBtn.classList.remove('listening');
                    statusEl.textContent = 'Остановлено — текст остаётся на экране';
                }
            });

            clearBtn.addEventListener('click', function() {
                clearAll();
                statusEl.textContent = isListening ? 'Очищено — продолжаю слушать' : 'Очищено';
            });

            marqueeBtn.addEventListener('click', toggleMarqueeMode);

            window.addEventListener('orientationchange', function() { renderAll(); });
            window.addEventListener('resize', function() {
                if (!marqueeMode) requestAnimationFrame(scrollToBottom);
            });
        })();
    </script>
</body>
</html>
