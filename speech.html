<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Русские субтитры — лента снизу вверх</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --controls-height: 84px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --font-size: 26px;
        }

        html, body {
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100%;
            width: 100%;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        /* Окно субтитров: прижато к низу, но выше панели кнопок */
        #subtitles-window {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(var(--controls-height) + var(--safe-bottom) + 8px);
            height: 34vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px 16px 8px;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.9) 35%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
            pointer-events: none;
        }

        #lines {
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.35s ease;
            will-change: transform;
        }

        .sub-line {
            font-size: var(--font-size);
            line-height: 1.22;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.95);
            word-wrap: break-word;
            overflow-wrap: anywhere;
            opacity: 0;
            transform: translateY(16px);
            animation: lineIn 0.3s ease forwards;
        }

        .sub-line:not(:last-child) { color: #b8b8b8; }
        .sub-line:last-child { color: #ffffff; }

        @keyframes lineIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Панель управления: три кнопки */
        .controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--controls-height);
            padding: 10px 12px calc(10px + var(--safe-bottom));
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6));
            z-index: 10;
        }

        button {
            flex: 1 1 0;
            padding: 13px 0;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 13px;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        button:active { opacity: 0.75; transform: scale(0.97); }

        #startBtn { background: #007aff; }
        #stopBtn  { background: #ff3b30; display: none; }
        /* Очистить — второстепенная, серая */
        #clearBtn { background: #3a3a3c; flex: 0.8 1 0; }

        /* Статус сверху */
        #status {
            position: fixed;
            top: calc(8px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            font-size: 13px;
            color: #888;
            text-align: center;
            padding: 0 16px;
            z-index: 5;
            pointer-events: none;
        }

        /* Скрытый элемент для измерения ширины текста */
        #measure {
            position: absolute;
            visibility: hidden;
            white-space: nowrap;
            font-size: var(--font-size);
            font-weight: 600;
            font-family: system-ui, -apple-system, sans-serif;
            left: -9999px;
            top: 0;
        }

        /* Горизонтальная ориентация */
        @media (orientation: landscape) {
            :root {
                --controls-height: 70px;
                --font-size: 30px;
            }
            #subtitles-window { height: 42vh; }
            button { font-size: 15px; padding: 11px 0; }
        }

        /* Очень узкие экраны */
        @media (max-width: 360px) {
            button { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="status">Нажмите «Начать» для распознавания русской речи</div>

    <div id="subtitles-window">
        <div id="lines"></div>
    </div>

    <div class="controls">
        <button id="startBtn">Начать</button>
        <button id="stopBtn">Остановить</button>
        <button id="clearBtn">Очистить</button>
    </div>

    <span id="measure"></span>

    <script>
        (function() {
            const statusEl   = document.getElementById('status');
            const linesEl    = document.getElementById('lines');
            const measureEl  = document.getElementById('measure');
            const startBtn   = document.getElementById('startBtn');
            const stopBtn    = document.getElementById('stopBtn');
            const clearBtn   = document.getElementById('clearBtn');
            const windowEl   = document.getElementById('subtitles-window');

            let recognition = null;
            let isListening = false;

            const MAX_LINES = 3;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusEl.textContent = 'Браузер не поддерживает распознавание речи. Используйте Chrome или Safari.';
                startBtn.disabled = true;
                return;
            }

            function getMaxTextWidth() {
                return windowEl.clientWidth - 32;
            }

            function wrapText(text, maxWidth) {
                const words = text.split(/\s+/);
                const lines = [];
                let current = '';

                for (const word of words) {
                    const test = current ? current + ' ' + word : word;
                    measureEl.textContent = test;
                    if (measureEl.offsetWidth <= maxWidth || !current) {
                        current = test;
                    } else {
                        lines.push(current);
                        current = word;
                    }
                }
                if (current) lines.push(current);
                return lines;
            }

            function scrollToBottom() {
                const overflow = linesEl.scrollHeight - windowEl.clientHeight + 8;
                linesEl.style.transform = overflow > 0 ? `translateY(-${overflow}px)` : 'translateY(0)';
            }

            function appendText(text) {
                text = text.trim();
                if (!text) return;

                const lines = wrapText(text, getMaxTextWidth());

                for (const lineText of lines) {
                    const div = document.createElement('div');
                    div.className = 'sub-line';
                    div.textContent = lineText;
                    linesEl.appendChild(div);
                }

                while (linesEl.children.length > MAX_LINES) {
                    linesEl.removeChild(linesEl.firstChild);
                }

                requestAnimationFrame(scrollToBottom);
            }

            // Очистка ленты без остановки распознавания
            function clearLines() {
                linesEl.innerHTML = '';
                linesEl.style.transform = 'translateY(0)';
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                let finalText = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalText += event.results[i][0].transcript;
                    }
                }
                if (finalText.trim()) appendText(finalText.trim());
            };

            recognition.onerror = function(e) {
                console.error(e);
                if (e.error === 'not-allowed') statusEl.textContent = 'Доступ к микрофону запрещён.';
                else if (e.error === 'no-speech') statusEl.textContent = 'Речь не обнаружена, слушаю...';
            };

            recognition.onend = function() {
                if (isListening) { try { recognition.start(); } catch(e) {} }
            };

            startBtn.addEventListener('click', function() {
                statusEl.textContent = 'Слушаю... Говорите по-русски.';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                isListening = true;
                try { recognition.start(); } catch(e) {}
            });

            stopBtn.addEventListener('click', function() {
                isListening = false;
                recognition.stop();
                statusEl.textContent = 'Остановлено — текст остаётся на экране';
                stopBtn.style.display = 'none';
                startBtn.style.display = 'block';
            });

            // Кнопка «Очистить» — только текст, распознавание не трогаем
            clearBtn.addEventListener('click', function() {
                clearLines();
                statusEl.textContent = isListening
                    ? 'Очищено — продолжаю слушать'
                    : 'Очищено';
            });

            window.addEventListener('orientationchange', function() {
                const existing = Array.from(linesEl.children).map(el => el.textContent).join(' ');
                linesEl.innerHTML = '';
                if (existing) appendText(existing);
            });

            window.addEventListener('resize', function() {
                requestAnimationFrame(scrollToBottom);
            });
        })();
    </script>
</body>
</html>
