<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Русские субтитры — две строки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер для двух строк */
        .subtitles-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 0;
            background: rgba(0, 0, 0, 0.85);
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        /* Каждая строка — отдельная бегущая дорожка */
        .marquee-line {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .marquee-line span {
            display: inline-block;
            font-size: 44px;
            font-weight: bold;
            color: #fff;
            padding-left: 100%;
            will-change: transform;
            animation: marquee 10s linear infinite;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Верхняя строка — чуть тусклее, нижняя — ярче (акцент на текущем) */
        #line-top span { color: #cccccc; font-size: 40px; }
        #line-bottom span { color: #ffffff; }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* Панель управления */
        .controls {
            position: fixed;
            bottom: 30px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        #startBtn { background: #007aff; }
        #stopBtn { background: #ff3b30; display: none; }

        #status {
            position: fixed;
            top: 20px;
            font-size: 16px;
            color: #888;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div id="status">Нажмите «Начать» для распознавания русской речи</div>

    <!-- Две бегущие строки -->
    <div class="subtitles-wrapper">
        <div class="marquee-line" id="line-top">
            <span>Ожидание речи...</span>
        </div>
        <div class="marquee-line" id="line-bottom">
            <span>...</span>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn">Начать</button>
        <button id="stopBtn">Остановить</button>
    </div>

    <script>
        (function() {
            const statusEl = document.getElementById('status');
            const topSpan = document.querySelector('#line-top span');
            const bottomSpan = document.querySelector('#line-bottom span');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');

            let recognition = null;
            let isListening = false;

            // Буфер распознанных слов
            let wordBuffer = [];
            const WORDS_PER_LINE = 6; // Сколько слов помещается в одну строку
            let currentTop = 'Ожидание речи...';
            let currentBottom = '...';

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusEl.textContent = 'Браузер не поддерживает распознавание речи. Используйте Chrome или Safari.';
                startBtn.disabled = true;
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                let finalText = '';
                let interimText = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const t = event.results[i][0].transcript;
                    if (event.results[i].isFinal) finalText += t;
                    else interimText += t;
                }

                // Добавляем финальные слова в буфер
                if (finalText.trim()) {
                    const words = finalText.trim().split(/\s+/);
                    wordBuffer.push(...words);
                    // Ограничиваем буфер, чтобы не рос бесконечно
                    if (wordBuffer.length > WORDS_PER_LINE * 4) {
                        wordBuffer = wordBuffer.slice(-WORDS_PER_LINE * 4);
                    }
                    updateLines();
                }

                // Промежуточные слова показываем в нижней строке (для отзывчивости)
                if (interimText.trim()) {
                    const interimWords = interimText.trim().split(/\s+/).slice(-WORDS_PER_LINE);
                    bottomSpan.textContent = interimWords.join(' ');
                    restartMarquee(bottomSpan);
                }
            };

            recognition.onerror = function(e) {
                console.error(e);
                if (e.error === 'not-allowed') {
                    statusEl.textContent = 'Доступ к микрофону запрещён.';
                } else if (e.error === 'no-speech') {
                    statusEl.textContent = 'Речь не обнаружена, слушаю...';
                }
            };

            recognition.onend = function() {
                if (isListening) {
                    try { recognition.start(); } catch (e) {}
                }
            };

            // Обновление двух строк: верхняя — предыдущая порция, нижняя — текущая
            function updateLines() {
                if (wordBuffer.length === 0) return;

                // Берём последние N*2 слов: первая половина → верхняя, вторая → нижняя
                const totalNeeded = WORDS_PER_LINE * 2;
                const recent = wordBuffer.slice(-totalNeeded);
                const mid = Math.max(0, recent.length - WORDS_PER_LINE);

                const topText = recent.slice(0, mid).join(' ');
                const bottomText = recent.slice(mid).join(' ');

                if (topText && topText !== currentTop) {
                    currentTop = topText;
                    topSpan.textContent = topText;
                    restartMarquee(topSpan);
                }
                if (bottomText && bottomText !== currentBottom) {
                    currentBottom = bottomText;
                    bottomSpan.textContent = bottomText;
                    restartMarquee(bottomSpan);
                }
            }

            // Перезапуск анимации (чтобы скорость подстроилась под новую длину)
            function restartMarquee(span) {
                span.style.animation = 'none';
                void span.offsetWidth;
                // Скорость подстраивается: чем длиннее текст, тем дольше едет
                const duration = Math.max(6, span.textContent.length * 0.15);
                span.style.animation = `marquee ${duration}s linear infinite`;
            }

            startBtn.addEventListener('click', function() {
                statusEl.textContent = 'Слушаю... Говорите по-русски.';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                isListening = true;
                wordBuffer = [];
                try { recognition.start(); } catch (e) {}
            });

            stopBtn.addEventListener('click', function() {
                isListening = false;
                recognition.stop();
                statusEl.textContent = 'Остановлено';
                stopBtn.style.display = 'none';
                startBtn.style.display = 'inline-block';
            });
        })();
    </script>
</body>
</html>
