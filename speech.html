<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Русские субтитры — на весь экран</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --controls-height: 84px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --font-size: 26px;
        }

        html, body {
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100%;
            width: 100%;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        /* Окно субтитров: почти на весь экран */
        #subtitles-window {
            position: fixed;
            left: 0;
            right: 0;
            top: calc(28px + var(--safe-top));
            bottom: calc(var(--controls-height) + var(--safe-bottom) + 4px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px 16px 8px;
            /* лёгкий градиент сверху, чтобы верхние строки плавно таяли */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 12%);
            pointer-events: none;
        }

        #lines {
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.35s ease;
            will-change: transform;
        }

        .sub-line {
            font-size: var(--font-size);
            line-height: 1.22;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.95);
            word-wrap: break-word;
            overflow-wrap: anywhere;
            opacity: 0;
            transform: translateY(16px);
            animation: lineIn 0.3s ease forwards;
        }

        .sub-line:not(:last-child) { color: #b8b8b8; }
        .sub-line:last-child { color: #ffffff; }

        @keyframes lineIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Панель управления */
        .controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--controls-height);
            padding: 10px 12px calc(10px + var(--safe-bottom));
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6));
            z-index: 10;
        }

        button {
            flex: 1 1 0;
            padding: 13px 0;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 13px;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        button:active { opacity: 0.75; transform: scale(0.97); }

        #startBtn { background: #007aff; }
        #stopBtn  { background: #ff3b30; display: none; }
        #clearBtn { background: #3a3a3c; flex: 0.8 1 0; }

        #status {
            position: fixed;
            top: calc(4px + var(--safe-top));
            left: 0;
            right: 0;
            font-size: 12px;
            color: #777;
            text-align: center;
            padding: 0 16px;
            z-index: 5;
            pointer-events: none;
        }

        #measure {
            position: absolute;
            visibility: hidden;
            white-space: nowrap;
            font-size: var(--font-size);
            font-weight: 600;
            font-family: system-ui, -apple-system, sans-serif;
            left: -9999px;
            top: 0;
        }

        @media (orientation: landscape) {
            :root {
                --controls-height: 70px;
                --font-size: 30px;
            }
            button { font-size: 15px; padding: 11px 0; }
        }

        @media (max-width: 360px) {
            button { font-size: 13px; }
            :root { --font-size: 23px; }
        }
    </style>
</head>
<body>

    <div id="status">Нажмите «Начать» для распознавания русской речи</div>

    <div id="subtitles-window">
        <div id="lines"></div>
    </div>

    <div class="controls">
        <button id="startBtn">Начать</button>
        <button id="stopBtn">Остановить</button>
        <button id="clearBtn">Очистить</button>
    </div>

    <span id="measure"></span>

    <script>
        (function() {
            const statusEl   = document.getElementById('status');
            const linesEl    = document.getElementById('lines');
            const measureEl  = document.getElementById('measure');
            const startBtn   = document.getElementById('startBtn');
            const stopBtn    = document.getElementById('stopBtn');
            const clearBtn   = document.getElementById('clearBtn');
            const windowEl   = document.getElementById('subtitles-window');

            let recognition = null;
            let isListening = false;

            // --- Дедупликация ---
            // Храним все уже добавленные слова, чтобы не повторять их
            let addedWords = [];          // массив строк (для контекста)
            let addedWordsSet = new Set(); // для быстрой проверки

            // Сколько строк максимум держим в DOM (на весь экран — можно больше)
            const MAX_LINES = 8;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusEl.textContent = 'Браузер не поддерживает распознавание речи. Используйте Chrome или Safari.';
                startBtn.disabled = true;
                return;
            }

            function getMaxTextWidth() {
                return windowEl.clientWidth - 32;
            }

            function wrapText(text, maxWidth) {
                const words = text.split(/\s+/);
                const lines = [];
                let current = '';

                for (const word of words) {
                    const test = current ? current + ' ' + word : word;
                    measureEl.textContent = test;
                    if (measureEl.offsetWidth <= maxWidth || !current) {
                        current = test;
                    } else {
                        lines.push(current);
                        current = word;
                    }
                }
                if (current) lines.push(current);
                return lines;
            }

            function scrollToBottom() {
                const overflow = linesEl.scrollHeight - windowEl.clientHeight + 8;
                linesEl.style.transform = overflow > 0 ? `translateY(-${overflow}px)` : 'translateY(0)';
            }

            // --- Ключевая функция: фильтрация повторов ---
            // Web Speech API возвращает "накопительный" transcript в каждом событии,
            // поэтому мы берём только те слова, которых ещё не было в конце нашей истории.
            function extractNewWords(transcript) {
                const incoming = transcript
                    .trim()
                    .toLowerCase()
                    .replace(/[.,!?;:—–]/g, '')   // убираем пунктуацию для сравнения
                    .split(/\s+/)
                    .filter(Boolean);

                if (incoming.length === 0) return [];

                // Ищем, с какого места incoming совпадает с "хвостом" уже добавленных слов.
                // Это защищает от повторов типа: было "привет как дела",
                // пришло "привет как дела хорошо" -> добавим только "хорошо".
                const tailLen = Math.min(incoming.length, addedWords.length);
                let overlap = 0;

                for (let len = tailLen; len > 0; len--) {
                    const tail = addedWords.slice(-len).map(w => w.toLowerCase().replace(/[.,!?;:—–]/g, ''));
                    const head = incoming.slice(0, len);
                    let match = true;
                    for (let i = 0; i < len; i++) {
                        if (tail[i] !== head[i]) { match = false; break; }
                    }
                    if (match) { overlap = len; break; }
                }

                // Новые слова — всё, что после найденного перекрытия
                let newWords = incoming.slice(overlap);

                // Дополнительная защита: убираем слова, которые уже были в последних 30 словах
                const recentSet = new Set(addedWords.slice(-30).map(w => w.toLowerCase().replace(/[.,!?;:—–]/g, '')));
                newWords = newWords.filter(w => !recentSet.has(w));

                return newWords;
            }

            function appendWords(newWords) {
                if (!newWords.length) return;

                // Сохраняем в историю
                for (const w of newWords) {
                    addedWords.push(w);
                    addedWordsSet.add(w.toLowerCase());
                }
                // Ограничиваем историю, чтобы не росла бесконечно
                if (addedWords.length > 500) {
                    addedWords = addedWords.slice(-300);
                    addedWordsSet = new Set(addedWords.map(w => w.toLowerCase()));
                }

                // Формируем текст для отображения
                const text = newWords.join(' ');
                const lines = wrapText(text, getMaxTextWidth());

                for (const lineText of lines) {
                    const div = document.createElement('div');
                    div.className = 'sub-line';
                    div.textContent = lineText;
                    linesEl.appendChild(div);
                }

                while (linesEl.children.length > MAX_LINES) {
                    linesEl.removeChild(linesEl.firstChild);
                }

                requestAnimationFrame(scrollToBottom);
            }

            function clearLines() {
                linesEl.innerHTML = '';
                linesEl.style.transform = 'translateY(0)';
                addedWords = [];
                addedWordsSet = new Set();
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                // Собираем ВЕСЬ финальный текст из текущего event
                let finalText = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalText += event.results[i][0].transcript + ' ';
                    }
                }
                if (finalText.trim()) {
                    const newWords = extractNewWords(finalText);
                    appendWords(newWords);
                }
            };

            recognition.onerror = function(e) {
                console.error(e);
                if (e.error === 'not-allowed') statusEl.textContent = 'Доступ к микрофону запрещён.';
                else if (e.error === 'no-speech') statusEl.textContent = 'Речь не обнаружена, слушаю...';
            };

            recognition.onend = function() {
                if (isListening) { try { recognition.start(); } catch(e) {} }
            };

            startBtn.addEventListener('click', function() {
                statusEl.textContent = 'Слушаю... Говорите по-русски.';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                isListening = true;
                try { recognition.start(); } catch(e) {}
            });

            stopBtn.addEventListener('click', function() {
                isListening = false;
                recognition.stop();
                statusEl.textContent = 'Остановлено — текст остаётся на экране';
                stopBtn.style.display = 'none';
                startBtn.style.display = 'block';
            });

            clearBtn.addEventListener('click', function() {
                clearLines();
                statusEl.textContent = isListening ? 'Очищено — продолжаю слушать' : 'Очищено';
            });

            window.addEventListener('orientationchange', function() {
                // Пересобираем ленту из уже добавленных слов
                const allText = addedWords.join(' ');
                linesEl.innerHTML = '';
                if (allText) {
                    // Добавляем без повторной дедупликации
                    const lines = wrapText(allText, getMaxTextWidth());
                    for (const lineText of lines) {
                        const div = document.createElement('div');
                        div.className = 'sub-line';
                        div.textContent = lineText;
                        linesEl.appendChild(div);
                    }
                    while (linesEl.children.length > MAX_LINES) {
                        linesEl.removeChild(linesEl.firstChild);
                    }
                    requestAnimationFrame(scrollToBottom);
                }
            });

            window.addEventListener('resize', function() {
                requestAnimationFrame(scrollToBottom);
            });
        })();
    </script>
</body>
</html>
