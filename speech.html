<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Русские субтитры — лента снизу вверх</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* лента прижата к низу */
            align-items: center;
        }

        /* Окно субтитров: фиксированная высота, скрывает всё, что вышло за верх */
        #subtitles-window {
            width: 100%;
            height: 40vh;               /* сколько места занимает лента */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;  /* новые строки прижимаются к низу */
            padding: 20px 24px;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 40%);
            /* маска сверху для плавного исчезновения старых строк */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
        }

        #lines {
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.35s ease;
        }

        .sub-line {
            font-size: 34px;
            line-height: 1.25;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            word-wrap: break-word;
            opacity: 0;
            transform: translateY(20px);
            animation: lineIn 0.35s ease forwards;
        }

        /* Последняя (самая нижняя) строка — акцентная, чуть ярче */
        .sub-line:last-child {
            color: #ffffff;
        }

        /* Предыдущие — приглушены */
        .sub-line:not(:last-child) {
            color: #bbbbbb;
        }

        @keyframes lineIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .controls {
            position: fixed;
            bottom: 20px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        #startBtn { background: #007aff; }
        #stopBtn { background: #ff3b30; display: none; }

        #status {
            position: fixed;
            top: 20px;
            font-size: 15px;
            color: #888;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        /* Скрытый элемент для измерения ширины текста */
        #measure {
            position: absolute;
            visibility: hidden;
            white-space: nowrap;
            font-size: 34px;
            font-weight: 600;
            font-family: system-ui, -apple-system, sans-serif;
            left: -9999px;
            top: 0;
        }
    </style>
</head>
<body>

    <div id="status">Нажмите «Начать» для распознавания русской речи</div>

    <!-- Окно с лентой субтитров -->
    <div id="subtitles-window">
        <div id="lines"></div>
    </div>

    <div class="controls">
        <button id="startBtn">Начать</button>
        <button id="stopBtn">Остановить</button>
    </div>

    <span id="measure"></span>

    <script>
        (function() {
            const statusEl   = document.getElementById('status');
            const linesEl    = document.getElementById('lines');
            const measureEl  = document.getElementById('measure');
            const startBtn   = document.getElementById('startBtn');
            const stopBtn    = document.getElementById('stopBtn');

            let recognition = null;
            let isListening = false;

            // Сколько строк максимум держим на экране
            const MAX_LINES = 4;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusEl.textContent = 'Браузер не поддерживает распознавание речи. Используйте Chrome или Safari.';
                startBtn.disabled = true;
                return;
            }

            // --- Разбивка текста на строки по ширине контейнера ---
            function wrapText(text, maxWidth) {
                const words = text.split(/\s+/);
                const lines = [];
                let current = '';

                for (const word of words) {
                    const test = current ? current + ' ' + word : word;
                    measureEl.textContent = test;
                    if (measureEl.offsetWidth <= maxWidth || !current) {
                        current = test;
                    } else {
                        lines.push(current);
                        current = word;
                    }
                }
                if (current) lines.push(current);
                return lines;
            }

            // --- Добавить новый текст в ленту ---
            function appendText(text) {
                text = text.trim();
                if (!text) return;

                // Ширина, доступная для текста (за вычетом padding окна)
                const winWidth = document.getElementById('subtitles-window').clientWidth - 48;

                const lines = wrapText(text, winWidth);

                for (const lineText of lines) {
                    const div = document.createElement('div');
                    div.className = 'sub-line';
                    div.textContent = lineText;
                    linesEl.appendChild(div);
                }

                // Ограничиваем количество строк: удаляем верхние
                while (linesEl.children.length > MAX_LINES) {
                    linesEl.removeChild(linesEl.firstChild);
                }

                // Плавно прокручиваем, чтобы последняя строка была видна
                // (когда строк больше, чем помещается в окно)
                const windowEl = document.getElementById('subtitles-window');
                const overflow = linesEl.scrollHeight - windowEl.clientHeight;
                // Если контент выше окна — сдвигаем вверх на величину переполнения
                if (overflow > 0) {
                    linesEl.style.transform = `translateY(-${overflow}px)`;
                } else {
                    linesEl.style.transform = 'translateY(0)';
                }
            }

            // --- Обработка промежуточного текста (в реальном времени) ---
            let lastFinalWordCount = 0;

            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                let finalText = '';
                let interimText = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const t = event.results[i][0].transcript;
                    if (event.results[i].isFinal) finalText += t;
                    else interimText += t;
                }

                // Финальные фразы добавляем в ленту как новые строки
                if (finalText.trim()) {
                    appendText(finalText.trim());
                }
            };

            recognition.onerror = function(e) {
                console.error(e);
                if (e.error === 'not-allowed') statusEl.textContent = 'Доступ к микрофону запрещён.';
                else if (e.error === 'no-speech') statusEl.textContent = 'Речь не обнаружена, слушаю...';
            };

            recognition.onend = function() {
                if (isListening) { try { recognition.start(); } catch(e) {} }
            };

            startBtn.addEventListener('click', function() {
                statusEl.textContent = 'Слушаю... Говорите по-русски.';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                isListening = true;
                try { recognition.start(); } catch(e) {}
            });

            stopBtn.addEventListener('click', function() {
                isListening = false;
                recognition.stop();
                statusEl.textContent = 'Остановлено';
                stopBtn.style.display = 'none';
                startBtn.style.display = 'inline-block';
            });
        })();
    </script>
</body>
</html>
