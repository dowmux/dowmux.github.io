<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Классика · для слабослышащих</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #1c1c1e 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .player-card {
            max-width: 480px;
            width: 100%;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
            padding: 24px 20px 20px;
            overflow: hidden;
        }

        /* Обложка с визуализатором */
        .cover-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            background: #2c2c2e;
            margin-bottom: 16px;
            position: relative;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .cover-wrapper.playing img {
            transform: scale(1.03);
        }

        /* Визуализатор поверх обложки */
        #visualizer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            opacity: 0.95;
            pointer-events: none;
        }

        /* Пульсирующее кольцо вокруг обложки при воспроизведении */
        .cover-wrapper.playing::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            box-shadow: inset 0 0 40px rgba(255, 45, 85, 0.3);
            animation: pulseGlow 2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: inset 0 0 20px rgba(255, 45, 85, 0.15); }
            50% { box-shadow: inset 0 0 50px rgba(255, 45, 85, 0.45); }
        }

        .track-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 12px;
        }

        .track-text { flex: 1; min-width: 0; }

        .title {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.25;
            color: #ffffff;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            font-size: 1.05rem;
            font-weight: 500;
            color: #ff2d55;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .boost-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            color: #ffffff;
            font-size: 1.4rem;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .boost-btn:hover { background: rgba(255, 255, 255, 0.14); }
        .boost-btn:active { transform: scale(0.92); }

        .boost-btn.active {
            background: #ff2d55;
            box-shadow: 0 0 24px rgba(255, 45, 85, 0.5);
            animation: pulseBoost 1.8s infinite ease-in-out;
        }

        @keyframes pulseBoost {
            0%, 100% { box-shadow: 0 0 24px rgba(255, 45, 85, 0.4); }
            50% { box-shadow: 0 0 40px rgba(255, 45, 85, 0.8); }
        }

        /* Пресеты эквалайзера */
        .presets {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 2px 0;
        }

        .presets::-webkit-scrollbar { display: none; }

        .preset-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 8px 14px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }

        .preset-btn:hover { background: rgba(255, 255, 255, 0.14); }
        .preset-btn:active { transform: scale(0.95); }

        .preset-btn.active {
            background: #ff2d55;
            border-color: #ff2d55;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 45, 85, 0.4);
        }

        /* Компрессор (выравнивание громкости) */
        .compressor-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 14px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .compressor-row:hover { background: rgba(255, 255, 255, 0.08); }

        .compressor-info { display: flex; flex-direction: column; gap: 2px; }

        .compressor-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
        }

        .compressor-desc {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .toggle-switch {
            width: 48px;
            height: 28px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            position: relative;
            transition: background 0.25s;
            flex-shrink: 0;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .compressor-row.active .toggle-switch { background: #30d158; }
        .compressor-row.active .toggle-switch::after { transform: translateX(20px); }

        /* Прогресс */
        .progress-container { margin-bottom: 8px; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            transition: height 0.15s;
        }

        .progress-bar:hover { height: 8px; }

        .progress-fill {
            height: 100%;
            background: #ffffff;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 500;
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            margin: 16px 0 20px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            padding: 8px;
            opacity: 0.9;
        }

        .ctrl-btn:hover { opacity: 1; transform: scale(1.05); }
        .ctrl-btn:active { transform: scale(0.9); opacity: 0.7; }
        .ctrl-btn svg { width: 32px; height: 32px; fill: currentColor; }
        .ctrl-btn.play svg { width: 44px; height: 44px; }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .volume-row svg {
            width: 18px;
            height: 18px;
            fill: rgba(255, 255, 255, 0.5);
            flex-shrink: 0;
        }

        .volume-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        /* Индикатор уровня сигнала */
        .level-meter {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .level-meter-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 60px;
        }

        .level-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .level-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #30d158 0%, #ffd60a 70%, #ff453a 100%);
            border-radius: 4px;
            transition: width 0.08s linear;
        }

        .playlist {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }

        .playlist::-webkit-scrollbar { width: 4px; }
        .playlist::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        .playlist-header {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.5);
            padding: 4px 8px 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .track-item:hover { background: rgba(255, 255, 255, 0.06); }
        .track-item.active { background: rgba(255, 255, 255, 0.1); }

        .track-item img {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .track-item-meta { flex: 1; min-width: 0; }

        .track-item-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-item.active .track-item-title { color: #ff2d55; }

        .track-item-artist {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.55);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playing-indicator {
            font-size: 0.9rem;
            color: #ff2d55;
            opacity: 0;
            flex-shrink: 0;
        }

        .track-item.active .playing-indicator {
            opacity: 1;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        audio { display: none; }

        .audio-status {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            padding: 4px 0 10px;
            min-height: 16px;
        }

        .audio-status.error { color: #ff453a; }
        .audio-status.ok { color: #30d158; }

        @media (max-width: 480px) {
            .player-card { padding: 18px 14px 14px; border-radius: 20px; }
            .title { font-size: 1.15rem; }
            .artist { font-size: 0.95rem; }
            .controls { gap: 24px; }
            .ctrl-btn svg { width: 28px; height: 28px; }
            .ctrl-btn.play svg { width: 40px; height: 40px; }
            .boost-btn { width: 46px; height: 46px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="player-card">
        <div class="cover-wrapper" id="coverWrapper">
            <img id="coverImage" src="https://placehold.co/600x600/1c1c1e/ff2d55?text=Beethoven" alt="Обложка">
            <canvas id="visualizer"></canvas>
        </div>

        <div class="track-info">
            <div class="track-text">
                <div id="trackTitle" class="title">Лунная соната</div>
                <div id="artistName" class="artist">Бетховен</div>
            </div>
            <button class="boost-btn" id="boostBtn" aria-label="Усилить высокие частоты" title="Усилить высокие частоты">
                <span>🎚️</span>
            </button>
        </div>

        <!-- Пресеты эквалайзера -->
        <div class="presets" id="presets">
            <button class="preset-btn active" data-preset="flat">Плоский</button>
            <button class="preset-btn" data-preset="piano">Фортеп.</button>
            <button class="preset-btn" data-preset="strings">Струнные</button>
            <button class="preset-btn" data-preset="orchestra">Оркестр</button>
            <button class="preset-btn" data-preset="voice">Вокал</button>
        </div>

        <!-- Компрессор -->
        <div class="compressor-row" id="compressorRow">
            <div class="compressor-info">
                <div class="compressor-label">Выравнивание громкости</div>
                <div class="compressor-desc">Тихие пассажи не пропадут</div>
            </div>
            <div class="toggle-switch"></div>
        </div>

        <audio id="audioPlayer" preload="auto" crossorigin="anonymous"></audio>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-labels">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prevBtn" aria-label="Предыдущий трек">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="ctrl-btn play" id="playBtn" aria-label="Воспроизвести">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn" id="nextBtn" aria-label="Следующий трек">
                <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
            </button>
        </div>

        <!-- Индикатор уровня сигнала -->
        <div class="level-meter">
            <span class="level-meter-label">Уровень</span>
            <div class="level-bar-bg">
                <div class="level-bar-fill" id="levelBarFill"></div>
            </div>
        </div>

        <div class="volume-row">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Громкость">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </div>

        <div class="audio-status" id="audioStatus"></div>

        <div class="playlist">
            <div class="playlist-header">Плейлист</div>
            <div id="playlistContainer"></div>
        </div>
    </div>

    <script>
        (function(){
            const tracks = [
                {  artist: "Людвиг ван Бетховен",
                    title: "Лунная соната (I. Adagio sostenuto)",
                    url: "https://download.stream.publicradio.org/podcast/minnesota/classical/programs/free-downloads/2017/06/15/daily_download_20170615_128.mp3",
                    cover: "https://s1.hitmo.net/collection/000/149/912/403605_large.jpg"
                },
                {
                    artist: "Вольфганг Амадей Моцарт",
                    title: "Симфония №40, I. Molto allegro",
                    url: "https://dl2.mp3party.net/online/8989751.mp3",
                    cover: "https://yandex-partner-web.advmusic.com/images/avatar_road.png"
                },
                { artist: "Anjunachill", title: "Anjunachill",
                  url: "https://promodj.com/prelisten/7989966/Anjunachill_Anjunachill_On_Air_17_with_No_Solange_17.mp3?hq=1&podcast=1",
                  cover: "https://cdn.1001tracklists.com/images/artworks/sources/6/7/a/7/161207-artwork-the-anjunadeep-edition-5848458523e77-Medium.jpg" }
            ];

            const audio = document.getElementById('audioPlayer');
            const coverImage = document.getElementById('coverImage');
            const coverWrapper = document.getElementById('coverWrapper');
            const trackTitle = document.getElementById('trackTitle');
            const artistName = document.getElementById('artistName');
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const boostBtn = document.getElementById('boostBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const playlistContainer = document.getElementById('playlistContainer');
            const audioStatus = document.getElementById('audioStatus');
            const presetsContainer = document.getElementById('presets');
            const compressorRow = document.getElementById('compressorRow');
            const levelBarFill = document.getElementById('levelBarFill');
            const visualizerCanvas = document.getElementById('visualizer');
            const ctx = visualizerCanvas.getContext('2d');

            let currentIndex = 0;
            let isBoosted = false;
            let isDragging = false;
            let currentPreset = 'flat';
            let compressorEnabled = false;

            // -------------------- WEB AUDIO --------------------
            let audioContext = null;
            let sourceNode = null;
            let trebleGain = null;
            let presenceFilter = null;
            let clarityFilter = null;
            let eqLow = null;
            let eqMid = null;
            let eqHigh = null;
            let compressor = null;
            let masterGain = null;
            let analyser = null;
            let webAudioReady = false;
            let rafId = null;

            function setStatus(msg, type) {
                audioStatus.textContent = msg;
                audioStatus.className = 'audio-status' + (type ? ' ' + type : '');
            }

            // Настройки пресетов эквалайзера: [low, mid, high] в дБ
            const PRESETS = {
                flat:      { low: 0,  mid: 0,   high: 0,   label: 'Плоский' },
                piano:     { low: 3,  mid: 2,   high: 4,   label: 'Фортепиано' },
                strings:   { low: -2, mid: 4,   high: 6,   label: 'Струнные' },
                orchestra: { low: 5,  mid: 0,   high: 5,   label: 'Оркестр' },
                voice:     { low: -3, mid: 6,   high: 3,   label: 'Вокал' }
            };

            function initAudioContext() {
                if (webAudioReady) return true;

                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) {
                        setStatus('⚠️ Web Audio не поддерживается', 'error');
                        return false;
                    }

                    audioContext = new AC();
                    sourceNode = audioContext.createMediaElementSource(audio);

                    // ---- Эквалайзер (3 полосы для пресетов) ----
                    eqLow = audioContext.createBiquadFilter();
                    eqLow.type = 'lowshelf';
                    eqLow.frequency.value = 250;
                    eqLow.gain.value = 0;

                    eqMid = audioContext.createBiquadFilter();
                    eqMid.type = 'peaking';
                    eqMid.frequency.value = 1500;
                    eqMid.Q.value = 0.9;
                    eqMid.gain.value = 0;

                    eqHigh = audioContext.createBiquadFilter();
                    eqHigh.type = 'highshelf';
                    eqHigh.frequency.value = 6000;
                    eqHigh.gain.value = 0;

                    // ---- Усиление ВЧ (кнопка boost) ----
                    trebleGain = audioContext.createBiquadFilter();
                    trebleGain.type = 'highshelf';
                    trebleGain.frequency.value = 3000;
                    trebleGain.gain.value = 0;

                    presenceFilter = audioContext.createBiquadFilter();
                    presenceFilter.type = 'peaking';
                    presenceFilter.frequency.value = 4000;
                    presenceFilter.Q.value = 0.8;
                    presenceFilter.gain.value = 0;

                    clarityFilter = audioContext.createBiquadFilter();
                    clarityFilter.type = 'highshelf';
                    clarityFilter.frequency.value = 10000;
                    clarityFilter.gain.value = 0;

                    // ---- Компрессор (выравнивание громкости) ----
                    compressor = audioContext.createDynamicsCompressor();
                    compressor.threshold.value = -24;
                    compressor.knee.value = 30;
                    compressor.ratio.value = 12;
                    compressor.attack.value = 0.003;
                    compressor.release.value = 0.25;

                    // ---- Мастер-громкость ----
                    masterGain = audioContext.createGain();
                    masterGain.gain.value = parseFloat(volumeSlider.value);

                    // ---- Анализатор для визуализации ----
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.8;

                    // Цепочка:
                    // source → eqLow → eqMid → eqHigh → trebleGain → presence → clarity
                    //        → compressor (если включён) → masterGain → analyser → destination
                    sourceNode.connect(eqLow);
                    eqLow.connect(eqMid);
                    eqMid.connect(eqHigh);
                    eqHigh.connect(trebleGain);
                    trebleGain.connect(presenceFilter);
                    presenceFilter.connect(clarityFilter);
                    clarityFilter.connect(compressor);
                    compressor.connect(masterGain);
                    masterGain.connect(analyser);
                    analyser.connect(audioContext.destination);

                    // Если компрессор выключен — обходим его (соединяем clarity → masterGain напрямую)
                    if (!compressorEnabled) {
                        clarityFilter.disconnect();
                        clarityFilter.connect(masterGain);
                    } else {
                        clarityFilter.disconnect();
                        clarityFilter.connect(compressor);
                    }

                    webAudioReady = true;
                    applyPreset(currentPreset, false);
                    setStatus('✓ Звук готов · нажмите ▶', 'ok');
                    return true;
                } catch (e) {
                    console.error('Web Audio init error:', e);
                    setStatus('⚠️ Ошибка аудио: ' + e.message, 'error');
                    return false;
                }
            }

            async function resumeAudioContext() {
                if (!audioContext) return;
                if (audioContext.state === 'suspended') {
                    try { await audioContext.resume(); } catch (e) { console.warn(e); }
                }
            }

            // Применение пресета эквалайзера
            function applyPreset(name, withStatus = true) {
                if (!webAudioReady) return;
                const p = PRESETS[name];
                if (!p) return;

                const now = audioContext.currentTime;
                eqLow.gain.setTargetAtTime(p.low, now, 0.1);
                eqMid.gain.setTargetAtTime(p.mid, now, 0.1);
                eqHigh.gain.setTargetAtTime(p.high, now, 0.1);

                currentPreset = name;

                // Обновляем кнопки
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.preset === name);
                });

                if (withStatus) {
                    setStatus(`Эквалайзер: ${p.label} (НЧ:${p.low} СЧ:${p.mid} ВЧ:${p.high})`, '');
                }
            }

            // Включение/выключение компрессора
            function setCompressor(enable) {
                if (!webAudioReady) return;
                compressorEnabled = enable;

                if (enable) {
                    clarityFilter.disconnect();
                    clarityFilter.connect(compressor);
                    compressor.connect(masterGain);
                    compressorRow.classList.add('active');
                    setStatus('✓ Выравнивание громкости включено', 'ok');
                } else {
                    clarityFilter.disconnect();
                    clarityFilter.connect(masterGain);
                    compressorRow.classList.remove('active');
                    setStatus('Выравнивание громкости выключено', '');
                }

                // Сохраняем настройку
                try { localStorage.setItem('classic-compressor', enable ? '1' : '0'); } catch (e) {}
            }

            function applyTrebleBoost(enable) {
                if (!webAudioReady) {
                    if (!initAudioContext()) return;
                }

                const now = audioContext.currentTime;
                if (enable) {
                    trebleGain.gain.setTargetAtTime(12, now, 0.08);
                    presenceFilter.gain.setTargetAtTime(6, now, 0.08);
                    clarityFilter.gain.setTargetAtTime(4, now, 0.08);
                    boostBtn.classList.add('active');
                    setStatus('✓ Усиление ВЧ (+12 дБ от 3 кГц)', 'ok');
                } else {
                    trebleGain.gain.setTargetAtTime(0, now, 0.08);
                    presenceFilter.gain.setTargetAtTime(0, now, 0.08);
                    clarityFilter.gain.setTargetAtTime(0, now, 0.08);
                    boostBtn.classList.remove('active');
                    setStatus('Усиление ВЧ выключено', '');
                }
                isBoosted = enable;
                try { localStorage.setItem('classic-boost', enable ? '1' : '0'); } catch (e) {}
            }

            function syncVolume() {
                const vol = parseFloat(volumeSlider.value);
                if (masterGain && audioContext) {
                    masterGain.gain.setTargetAtTime(vol, audioContext.currentTime, 0.02);
                } else {
                    audio.volume = vol;
                }
                try { localStorage.setItem('classic-volume', vol); } catch (e) {}
            }

            // -------------------- ВИЗУАЛИЗАТОР --------------------
            function resizeCanvas() {
                const rect = coverWrapper.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                visualizerCanvas.width = rect.width * dpr;
                visualizerCanvas.height = 60 * dpr;
                ctx.scale(dpr, dpr);
            }

            function drawVisualizer() {
                rafId = requestAnimationFrame(drawVisualizer);

                if (!analyser) {
                    // Если Web Audio не создан — рисуем «спящую» линию
                    ctx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
                    return;
                }

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);

                const w = visualizerCanvas.width / (window.devicePixelRatio || 1);
                const h = 60;

                ctx.clearRect(0, 0, w, h);

                const barCount = 48;
                const step = Math.floor(bufferLength / barCount);
                const barWidth = w / barCount;

                for (let i = 0; i < barCount; i++) {
                    // Берём среднее значение по группе частот
                    let sum = 0;
                    for (let j = 0; j < step; j++) {
                        sum += dataArray[i * step + j];
                    }
                    const avg = sum / step;
                    const barHeight = (avg / 255) * h * 0.9 + 2;

                    // Градиент: от красного к белому
                    const gradient = ctx.createLinearGradient(0, h, 0, h - barHeight);
                    gradient.addColorStop(0, 'rgba(255, 45, 85, 0.9)');
                    gradient.addColorStop(1, 'rgba(255, 200, 220, 0.95)');

                    ctx.fillStyle = gradient;
                    const x = i * barWidth + 1;
                    ctx.fillRect(x, h - barHeight, barWidth - 2, barHeight);
                }

                // Индикатор уровня (RMS)
                let rmsSum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    const v = (dataArray[i] / 255) ** 2;
                    rmsSum += v;
                }
                const rms = Math.sqrt(rmsSum / bufferLength);
                const levelPercent = Math.min(100, rms * 200);
                levelBarFill.style.width = levelPercent + '%';
            }

            // -------------------- ИКОНКИ --------------------
            const playSVG = '<path d="M8 5v14l11-7z"/>';
            const pauseSVG = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

            function setPlayIcon(isPlaying) {
                playIcon.innerHTML = isPlaying ? pauseSVG : playSVG;
                playBtn.setAttribute('aria-label', isPlaying ? 'Пауза' : 'Воспроизвести');
                coverWrapper.classList.toggle('playing', isPlaying);
            }

            // -------------------- ЗАГРУЗКА ТРЕКА --------------------
            function loadTrack(index) {
                const track = tracks[index];
                if (!track) return;

                trackTitle.textContent = track.title;
                artistName.textContent = track.artist;
                coverImage.src = track.cover;
                coverImage.alt = `Обложка: ${track.artist} — ${track.title}`;

                audio.src = track.url;
                audio.load();

                updateActivePlaylistItem(index);

                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                totalTimeEl.textContent = '0:00';

                audio.pause();
                setPlayIcon(false);
                try { localStorage.setItem('classic-index', index); } catch (e) {}
            }

            function updateActivePlaylistItem(index) {
                document.querySelectorAll('.track-item').forEach((item, i) => {
                    item.classList.toggle('active', i === index);
                });
            }

            // -------------------- ПЛЕЙЛИСТ --------------------
            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                tracks.forEach((track, i) => {
                    const item = document.createElement('div');
                    item.className = 'track-item' + (i === currentIndex ? ' active' : '');
                    item.dataset.index = i;

                    const img = document.createElement('img');
                    img.src = track.cover;
                    img.alt = track.artist;

                    const meta = document.createElement('div');
                    meta.className = 'track-item-meta';
                    meta.innerHTML = `
                        <div class="track-item-title">${track.title}</div>
                        <div class="track-item-artist">${track.artist}</div>
                    `;

                    const indicator = document.createElement('div');
                    indicator.className = 'playing-indicator';
                    indicator.textContent = '🔊';

                    item.appendChild(img);
                    item.appendChild(meta);
                    item.appendChild(indicator);

                    item.addEventListener('click', async () => {
                        initAudioContext();
                        await resumeAudioContext();

                        if (currentIndex === i) {
                            togglePlay();
                        } else {
                            currentIndex = i;
                            loadTrack(currentIndex);
                            try {
                                await audio.play();
                                setPlayIcon(true);
                            } catch (e) {
                                console.warn('Play error:', e);
                                setStatus('⚠️ ' + e.message, 'error');
                            }
                        }
                    });

                    playlistContainer.appendChild(item);
                });
            }

            // -------------------- ВОСПРОИЗВЕДЕНИЕ --------------------
            async function togglePlay() {
                initAudioContext();
                await resumeAudioContext();

                if (audio.paused) {
                    try {
                        await audio.play();
                        setPlayIcon(true);
                    } catch (e) {
                        setStatus('⚠️ ' + e.message, 'error');
                    }
                } else {
                    audio.pause();
                    setPlayIcon(false);
                }
            }

            // -------------------- ПРОГРЕСС --------------------
            function formatTime(sec) {
                if (isNaN(sec)) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            function updateProgress() {
                if (audio.duration && !isNaN(audio.duration) && !isDragging) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    totalTimeEl.textContent = formatTime(audio.duration);
                }
            }

            function seekFromEvent(e) {
                if (!audio.duration || isNaN(audio.duration)) return;
                const rect = progressBar.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
                const percent = x / rect.width;
                audio.currentTime = percent * audio.duration;
                progressFill.style.width = (percent * 100) + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }

            progressBar.addEventListener('mousedown', (e) => { isDragging = true; seekFromEvent(e); });
            window.addEventListener('mousemove', (e) => { if (isDragging) seekFromEvent(e); });
            window.addEventListener('mouseup', () => { isDragging = false; });
            progressBar.addEventListener('touchstart', (e) => { isDragging = true; seekFromEvent(e); }, { passive: true });
            progressBar.addEventListener('touchmove', (e) => { if (isDragging) seekFromEvent(e); }, { passive: true });
            progressBar.addEventListener('touchend', () => { isDragging = false; });

            // -------------------- СОБЫТИЯ --------------------
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => {
                totalTimeEl.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('error', () => {
                if (audio.error) {
                    const codes = {1:'прервано',2:'сетевая ошибка',3:'ошибка декодирования',4:'формат не поддерживается'};
                    setStatus('⚠️ Ошибка: ' + (codes[audio.error.code] || 'неизвестно'), 'error');
                }
            });

            audio.addEventListener('ended', async () => {
                if (tracks.length > 0) {
                    currentIndex = (currentIndex + 1) % tracks.length;
                    loadTrack(currentIndex);
                    try {
                        await audio.play();
                        setPlayIcon(true);
                    } catch (e) { console.warn(e); }
                } else {
                    setPlayIcon(false);
                }
            });

            audio.addEventListener('play', () => setPlayIcon(true));
            audio.addEventListener('pause', () => setPlayIcon(false));

            // -------------------- КНОПКИ --------------------
            playBtn.addEventListener('click', togglePlay);

            prevBtn.addEventListener('click', async () => {
                initAudioContext();
                await resumeAudioContext();
                if (tracks.length === 0) return;
                currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
                loadTrack(currentIndex);
                try { await audio.play(); setPlayIcon(true); } catch (e) {}
            });

            nextBtn.addEventListener('click', async () => {
                initAudioContext();
                await resumeAudioContext();
                if (tracks.length === 0) return;
                currentIndex = (currentIndex + 1) % tracks.length;
                loadTrack(currentIndex);
                try { await audio.play(); setPlayIcon(true); } catch (e) {}
            });

            boostBtn.addEventListener('click', async () => {
                if (!initAudioContext()) {
                    setStatus('⚠️ Усиление ВЧ недоступно', 'error');
                    return;
                }
                await resumeAudioContext();
                applyTrebleBoost(!isBoosted);
            });

            // Пресеты эквалайзера
            presetsContainer.addEventListener('click', async (e) => {
                const btn = e.target.closest('.preset-btn');
                if (!btn) return;

                if (!initAudioContext()) return;
                await resumeAudioContext();

                applyPreset(btn.dataset.preset);
                try { localStorage.setItem('classic-preset', btn.dataset.preset); } catch (e) {}
            });

            // Компрессор
            compressorRow.addEventListener('click', async () => {
                if (!initAudioContext()) return;
                await resumeAudioContext();
                setCompressor(!compressorEnabled);
            });

            volumeSlider.addEventListener('input', () => {
                syncVolume();
            });

            // -------------------- ИНИЦИАЛИЗАЦИЯ --------------------
            function init() {
                resizeCanvas();
                drawVisualizer();

                // Восстанавливаем настройки из localStorage
                let savedIndex = 0;
                try {
                    const saved = parseInt(localStorage.getItem('classic-index'));
                    if (!isNaN(saved) && saved >= 0 && saved < tracks.length) savedIndex = saved;
                } catch (e) {}
                currentIndex = savedIndex;

                renderPlaylist();
                loadTrack(currentIndex);

                // Громкость
                let savedVol = 1.0;
                try {
                    const v = parseFloat(localStorage.getItem('classic-volume'));
                    if (!isNaN(v)) savedVol = v;
                } catch (e) {}
                volumeSlider.value = savedVol;
                syncVolume();

                // Буст
                let savedBoost = false;
                try { savedBoost = localStorage.getItem('classic-boost') === '1'; } catch (e) {}

                // Пресет
                let savedPreset = 'flat';
                try {
                    const p = localStorage.getItem('classic-preset');
                    if (p && PRESETS[p]) savedPreset = p;
                } catch (e) {}

                // Компрессор
                let savedComp = false;
                try { savedComp = localStorage.getItem('classic-compressor') === '1'; } catch (e) {}

                // Визуально отмечаем активный пресет
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.preset === savedPreset);
                });
                if (savedComp) compressorRow.classList.add('active');

                // Восстанавливаем буст и компрессор после инициализации Web Audio
                const tryRestore = () => {
                    if (webAudioReady) {
                        if (savedBoost) applyTrebleBoost(true);
                        if (savedComp) setCompressor(true);
                        applyPreset(savedPreset, false);
                    } else {
                        setTimeout(tryRestore, 200);
                    }
                };

                // Восстановление только после первого жеста (звук всё равно не зазвучит до него)
                const restoreOnFirstGesture = () => {
                    if (!initAudioContext()) return;
                    resumeAudioContext().then(() => {
                        if (savedBoost) applyTrebleBoost(true);
                        if (savedComp) setCompressor(true);
                        applyPreset(savedPreset, false);
                    });
                    document.removeEventListener('click', restoreOnFirstGesture);
                };
                document.addEventListener('click', restoreOnFirstGesture, { once: false });

                setStatus('Нажмите ▶ для воспроизведения', '');
            }

            // Ресайз canvas
            window.addEventListener('resize', () => {
                resizeCanvas();
            });

            init();
        })();
    </script>
</body>
</html>
